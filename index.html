ation:rise .7s ease both}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-width:750px){.wrap{padding:0 23px}.top{min-height:105px;flex-wrap:wrap;gap:15px;padding-top:20px;padding-bottom:17px}.logo{font-size:18px}nav{gap:20px;font-size:11px}.hero{grid-template-columns:1fr;padding:40px 0 35px;gap:10px}h1{font-size:54px}.hero-art{max-width:360px;margin:auto;width:100%}.lead{font-size:18px}.ribbon{gap:12px;font-size:13px}.split,.adventure{grid-template-columns:1fr;gap:25px}.section{padding:55px 0}.cards{grid-template-columns:1fr;gap:5px}.card{padding:20px 0}.lab{padding:25px}.choices{flex-direction:column}.art-seal{max-width:230px}.questions{grid-template-columns:1fr}.foot{flex-direction:column;gap:8px}.hero-art p{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}\n<\/style><\/head><body><header><div class=\"wrap top\"><a class=\"logo\" href=\"#inicio\"><span aria-hidden=\"true\">✦<\/span><div>Filosofía para la vida<small>GRADO OCTAVO · UN ESPACIO PARA PREGUNTAR<\/small><\/div><\/a><nav aria-label=\"Navegación principal\"><a href=\"#\" id=\"enterCourseNav\">Los seis módulos ↗<\/a><a href=\"#curso\">El curso<\/a><a href=\"#explora\">Explora<\/a><a href=\"#aventura\">La historieta<\/a><a href=\"#preguntas\">Tus preguntas ↗<\/a><\/nav><\/div><\/header><main id=\"inicio\" class=\"wrap\"><section class=\"hero reveal\"><div><div class=\"tag\">Bienvenido a una nueva forma de mirar<\/div><h1>El mundo está<br>lleno de <em>porqués.<\/em><br>Empieza por uno.<\/h1><p class=\"lead\">¿Quién eres? ¿Cómo sabes que algo es verdad? ¿Qué significa vivir bien? La filosofía comienza cuando te atreves a preguntar.<\/p><div class=\"buttons\"><button class=\"btn\" id=\"enterCourseHero\">Entrar al curso completo &nbsp; ↗<\/button><a class=\"btn ghost\" href=\"#curso\">Conocer la asignatura<\/a><\/div><p class=\"small\">No necesitas tener todas las respuestas. Trae tu curiosidad.<\/p><\/div><div class=\"hero-art\"><svg viewBox=\"0 0 520 520\" role=\"img\" aria-label=\"Un libro abierto bajo una esfera celeste, símbolo del conocimiento y el asombro\"><defs><pattern id=\"lines\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 6L6 0\" stroke=\"#d7b66f\" opacity=\".09\"/><\/pattern><\/defs><path d=\"M55 450V220a205 205 0 0 1 410 0v230Z\" fill=\"#294237\" stroke=\"#d7b66f55\"/><path d=\"M75 450V220a185 185 0 0 1 370 0v230\" fill=\"none\" stroke=\"#d7b66f44\"/><g fill=\"none\" stroke=\"#d7b66f\"><circle cx=\"260\" cy=\"226\" r=\"140\"/><circle cx=\"260\" cy=\"226\" r=\"125\" stroke-dasharray=\"1 10\" stroke-width=\"4\"/><ellipse cx=\"260\" cy=\"226\" rx=\"65\" ry=\"140\" transform=\"rotate(32 260 226)\"/><ellipse cx=\"260\" cy=\"226\" rx=\"65\" ry=\"140\" transform=\"rotate(-32 260 226)\"/><ellipse cx=\"260\" cy=\"226\" rx=\"140\" ry=\"45\" transform=\"rotate(-20 260 226)\"/><\/g><circle cx=\"260\" cy=\"226\" r=\"30\" fill=\"#d7b66f\"/><text x=\"260\" y=\"239\" text-anchor=\"middle\" fill=\"#20332f\" font-size=\"39\" font-family=\"Georgia\">?<\/text><g fill=\"#efe3c9\"><path d=\"M97 351Q175 331 260 369V451Q182 415 97 433Z\"/><path d=\"M260 369Q345 331 423 351V433Q338 415 260 451Z\"/><\/g><g stroke=\"#a18b60\" fill=\"none\" stroke-width=\"2\"><path d=\"M260 369V451M110 370Q181 353 242 382M110 385Q180 369 242 397M110 401Q182 385 242 413M278 382Q344 354 410 370M278 397Q344 369 410 385M278 413Q344 386 410 401\"/><\/g><path d=\"M86 443Q180 425 260 463Q340 425 434 443\" stroke=\"#d7b66f\" stroke-width=\"7\" fill=\"none\"/><g fill=\"#d7b66f\" font-size=\"27\"><text x=\"83\" y=\"130\">✦<\/text><text x=\"409\" y=\"164\">✧<\/text><text x=\"254\" y=\"56\">✦<\/text><\/g><path d=\"M55 450V220a205 205 0 0 1 410 0v230Z\" fill=\"url(#lines)\"/><\/svg><p>Una pregunta puede abrir un universo.<\/p><\/div><\/section><div class=\"ribbon\"><span><b>01<\/b> Asómbrate de lo cotidiano<\/span><span><b>02<\/b> Piensa con tus propias razones<\/span><span><b>03<\/b> Escucha otras miradas<\/span><\/div>\n<section id=\"curso\" class=\"section split\"><div><div class=\"tag\">La asignatura<\/div><h2>Aprender a pensar.<br><em>Aprender a vivir.<\/em><\/h2><div class=\"quote\">La filosofía no se queda en los libros: aparece en tus decisiones, tus amistades y tu manera de comprender el mundo.<\/div><\/div><div class=\"copy\"><p><strong style=\"color:var(--paper)\">Filosofía para la vida<\/strong> es una invitación a mirar más allá de lo evidente. En grado octavo exploraremos preguntas sobre el ser humano, el conocimiento, los valores y la vida en sociedad.<\/p><p>Partiremos del asombro y de situaciones cercanas: una discusión en el colegio, una noticia en redes, una regla que parece injusta o una decisión difícil. Aprenderemos a formular preguntas, dar razones, reconocer distintos puntos de vista y revisar nuestras propias ideas.<\/p><p>Mediante diálogos, lecturas, historias y ejercicios de reflexión, distinguiremos filosofía e ideología y conectaremos lo que pensamos con lo que hacemos. Aquí, disentir con respeto también es una forma de aprender.<\/p><\/div><\/section>\n<section id=\"explora\" class=\"section\"><div class=\"tag\">Tres puertas de entrada<\/div><h2>Lo extraordinario está<br>en lo que <em>das por hecho.<\/em><\/h2><p class=\"copy\">Abre cada pregunta y descubre una forma diferente de mirar tu vida.<\/p><div class=\"cards\"><article class=\"card\"><span class=\"num\">I · El conocimiento<\/span><h3>¿Ver es siempre creer?<\/h3><p>Una imagen puede engañarnos. Una afirmación puede parecer cierta solo porque se repite mucho.<\/p><details><summary>Abre esta pregunta ↗<\/summary><p>Piensa en una noticia sorprendente. ¿Quién la publicó? ¿Qué pruebas presenta? ¿Qué te haría cambiar de opinión? La epistemología examina cómo conocemos y qué justifica nuestras creencias.<\/p><\/details><\/article><article class=\"card\"><span class=\"num\">II · La vida buena<\/span><h3>¿Todo lo permitido está bien?<\/h3><p>A veces una acción no rompe ninguna regla, pero puede lastimar a alguien. ¿Cómo decidir?<\/p><details><summary>Abre esta pregunta ↗<\/summary><p>Imagina que puedes compartir una foto vergonzosa sin recibir un castigo. ¿Deberías hacerlo? La ética nos invita a pensar en las razones, las consecuencias y el respeto por los demás.<\/p><\/details><\/article><article class=\"card\"><span class=\"num\">III · La identidad<\/span><h3>¿Eres tus publicaciones?<\/h3><p>Tu perfil cuenta algo sobre ti, pero quizá no todo. ¿Qué hace que sigas siendo tú cuando cambias?<\/p><details><summary>Abre esta pregunta ↗<\/summary><p>Compara cómo eras hace tres años con quien eres hoy. ¿Qué cambió? ¿Qué permanece? Las preguntas sobre la identidad ayudan a explorar quiénes somos, más allá de nuestras etiquetas.<\/p><\/details><\/article><\/div><\/section>\n<section class=\"section\"><div class=\"lab\"><div class=\"tag\">Haz una pausa · Un minuto para pensar<\/div><h3>“Si todo el grupo lo cree, debe ser verdad”.<\/h3><p>Un compañero comparte esta idea en el salón. ¿Qué le responderías? Elige una opción para continuar la conversación.<\/p><div class=\"choices\"><button data-choice=\"0\" aria-pressed=\"false\">La mayoría siempre tiene razón.<\/button><button data-choice=\"1\" aria-pressed=\"false\">Primero, revisemos las pruebas.<\/button><button data-choice=\"2\" aria-pressed=\"false\">Cada quien tiene su propia verdad.<\/button><\/div><p id=\"answer\" aria-live=\"polite\">No se trata de responder rápido: piensa qué razón sostiene tu elección.<\/p><\/div><\/section>\n<section id=\"aventura\" class=\"section adventure\"><div class=\"art-seal\" aria-hidden=\"true\"><span>✦<\/span><\/div><div><div class=\"tag\">Una historieta para viajar pensando<\/div><h2>Crónicas<br><em>del asombro.<\/em><\/h2><p class=\"copy\">Acompaña a Lía y a una brújula que se enciende con preguntas. Recorre la antigua Grecia, conversa con personajes del pasado y regresa a tu colegio con otra manera de ver el mundo.<\/p><p class=\"small\">8 escenas · Deslizamiento vertical · Decisiones y bitácora personal<br>Una aventura ficticia para explorar ideas filosóficas.<\/p><button class=\"btn\" id=\"openStory\">Entrar en la aventura &nbsp; ↗<\/button><\/div><\/section>\n<section id=\"preguntas\" class=\"section split\"><div><div class=\"tag\">Tu voz también cuenta<\/div><h2>La próxima gran<br>pregunta puede<br>ser <em>la tuya.<\/em><\/h2><p class=\"copy\">Elige una para empezar o escribe la que te acompaña hoy. No hay una respuesta automática: busca ejemplos, escucha otras perspectivas y explica tus razones.<\/p><div class=\"questions\"><button class=\"question\" data-q=\"0\">¿Ser feliz es tener todo lo que quiero?<\/button><button class=\"question\" data-q=\"1\">¿Puedo ser libre y seguir reglas?<\/button><button class=\"question\" data-q=\"2\">¿Cambiar de opinión es una debilidad?<\/button><button class=\"question\" data-q=\"3\">¿Debo respetar una idea que no comparto?<\/button><\/div><\/div><div><p class=\"tag\">Mi primera reflexión<\/p><p id=\"prompt\" class=\"prompt\" aria-live=\"polite\">¿Qué situación de tu vida te ha hecho preguntar “por qué”?<\/p><label for=\"reflection\">Escribe una pregunta y una primera idea:<\/label><textarea id=\"reflection\" placeholder=\"Me pregunto… Pienso que… porque… Un ejemplo sería…\"><\/textarea><p class=\"small\" id=\"saved\">Tu texto es personal: no se envía al docente. Se conserva en este navegador cuando está disponible.<\/p><button class=\"btn ghost\" id=\"export\">Descargar mi reflexión ↓<\/button><\/div><\/section><\/main><footer><div class=\"wrap foot\"><span>✦ &nbsp; Filosofía para la vida · Grado octavo<\/span><span>Pregunta con curiosidad. Argumenta con razones. Dialoga con respeto.<\/span><a href=\"#inicio\">Volver arriba ↑<\/a><\/div><\/footer><dialog id=\"story\"><div class=\"toolbar\"><span>Crónicas del asombro<\/span><button id=\"closeStory\">Cerrar ✕<\/button><\/div><iframe id=\"storyFrame\" title=\"Historieta interactiva Crónicas del asombro\"><\/iframe><\/dialog><script>\nconst replies=['Que muchas personas crean algo no demuestra que sea cierto. Una mayoría también puede equivocarse. ¿Qué evidencia permitiría examinar esa creencia?','Pedir pruebas ayuda a distinguir una afirmación de una justificación. También podemos preguntar si las fuentes son confiables y si existen explicaciones alternativas.','Las experiencias y opiniones pueden ser distintas, pero las afirmaciones sobre hechos se pueden contrastar. ¿Estamos hablando de un gusto personal o de algo que podemos verificar?'];document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#answer').textContent=replies[+b.dataset.choice]});const prompts=['¿Qué diferencia hay entre un deseo pasajero y algo que hace valiosa tu vida? Piensa en un ejemplo.','¿Qué reglas protegen la libertad de todos y cuáles necesitarían cambiar? Explica por qué.','¿Qué diferencia hay entre cambiar por presión y cambiar porque encontraste mejores razones?','¿Cómo distinguir el respeto por una persona del acuerdo con sus ideas?'];document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{document.querySelector('#prompt').textContent=prompts[+b.dataset.q];document.querySelector('#reflection').focus()});const input=document.querySelector('#reflection');try{input.value=localStorage.getItem('filosofia-inicio-reflexion')||''}catch(e){}input.oninput=()=>{try{localStorage.setItem('filosofia-inicio-reflexion',input.value);document.querySelector('#saved').textContent='Guardado en este navegador. Tu texto no se envía al docente.'}catch(e){document.querySelector('#saved').textContent='No se pudo guardar en este navegador. Descarga tu reflexión antes de cerrar.'}};document.querySelector('#export').onclick=()=>{if(!input.value.trim()){document.querySelector('#saved').textContent='Escribe tu primera idea antes de descargarla.';input.focus();return}const blob=new Blob([ ata-close>✕ Cerrar<\\/button><h2>Bitácora del tiempo<\\/h2><p>Las preguntas que te llevas importan tanto como las respuestas.<\\/p><div id=\\\"memories\\\"><\\/div><label for=\\\"note\\\">Mi pregunta sobre la vida o mi entorno<\\/label><textarea id=\\\"note\\\" placeholder=\\\"¿Qué significa vivir bien? ¿Cómo sé si una noticia es verdadera?\\\"><\\/textarea><p class=\\\"sub\\\" style=\\\"color:#53634e\\\" id=\\\"saveStatus\\\">Se guarda en este navegador cuando está disponible.<\\/p><button id=\\\"download\\\">Descargar mi bitácora<\\/button><\\/dialog>\\n<script>\\nconst scenes=[\\n{era:'El umbral',date:'HOY · UNA BIBLIOTECA OLVIDADA',title:'Crónicas<br>del <em>asombro.<\\/em>',place:'Toda gran aventura comienza con una pregunta.',type:'portal'},\\n{era:'Jonia',date:'SIGLO VI A. C. · EL MUNDO GRIEGO',title:'El mundo deja<br>de ser obvio.',type:'sea',a:['LÍA','Esta brújula no señala el norte… ¡se mueve cuando pregunto por qué!'],b:['LA BRÚJULA','Mira el mar. Puedes aceptar lo que te cuentan o buscar razones. El asombro abre la puerta a la filosofía.'],q:'¿Qué pregunta abre una investigación?',opts:['¿Qué explicación podemos examinar?','¿Qué debo repetir sin preguntar?'],responses:['Has encendido la brújula: preguntar y examinar razones inicia la indagación.','Repetir conserva una idea; examinarla te permite comprenderla. ¿Qué razones la sostienen?'],concept:'Filosofía: amor por la sabiduría. Esta parada explora la tradición griega; también existen otras tradiciones filosóficas.'},\\n{era:'Atenas',date:'SIGLO V A. C. · EL ÁGORA',title:'Una pregunta<br>dentro de otra.',type:'temple',a:['LÍA','Sócrates, si todos dicen que algo es justo… ¿entonces lo es?'],b:['SÓCRATES · DIÁLOGO IMAGINADO','Primero dime: ¿qué entiendes por justicia? Después probemos tu idea con un ejemplo.'],q:'Un grupo excluye a una compañera. ¿Qué harías?',opts:['Aceptar porque lo decidió la mayoría','Preguntar por las razones y escucharla'],responses:['La mayoría puede equivocarse. Pregunta si la decisión respeta a cada persona.','Escuchar y pedir razones permite examinar la justicia de la decisión.'],concept:'La ética examina nuestras acciones. El diálogo filosófico busca razones y revisa lo que creemos saber.'},\\n{era:'El archivo',date:'FUERA DEL TIEMPO · LA BIBLIOTECA DE LAS PREGUNTAS',title:'Cada puerta,<br>un misterio.',type:'library',a:['LÍA','¿La filosofía estudia una sola cosa?'],b:['LA GUARDIANA','Explora el conocimiento, el ser, nuestras acciones y la vida en común. Elige una puerta.'],q:'Toca una pregunta para descubrir su campo.',opts:['¿Cómo sé que es verdad?','¿Qué hace justa una acción?','¿Qué significa existir?','¿Cómo vivir juntos?'],responses:['Epistemología: examina el conocimiento, sus fundamentos y sus límites.','Ética: reflexiona sobre las acciones, los valores y la vida buena.','Ontología: pregunta por el ser y por lo que existe.','Filosofía política: examina el poder, la justicia y la vida en común.'],concept:'En la guía aparecen también psicología y sociología: hoy son disciplinas autónomas que dialogan con la filosofía.'},\\n{era:'Las ideas',date:'ÉPOCA MODERNA · EL TALLER DE LAS IDEAS',title:'¿Pensar juntos<br>es pensar igual?',type:'press',a:['LÍA','Este manifiesto dice cómo debería vivir todo el mundo. ¿Eso es filosofía?'],b:['LA BRÚJULA','Una ideología organiza creencias y valores de un grupo. La filosofía puede examinar sus supuestos. Ambas pueden relacionarse; ninguna etiqueta reemplaza los argumentos.'],q:'Alguien piensa distinto a ti. Elige una respuesta.',opts:['“Explícame tus razones”','“Si no piensas como yo, estás mal”'],responses:['El respeto y el examen crítico pueden convivir. Comprender no obliga a estar de acuerdo.','Descalificar cierra el diálogo. Examina la idea y sus efectos sin atacar a la persona.'],concept:'Filosofía e ideología no son sinónimos. Una ideología no es automáticamente falsa; también puede someterse a crítica.'},\\n{era:'El regreso',date:'PRESENTE · EL PATIO DEL COLEGIO',title:'La filosofía<br>sale del libro.',type:'school',a:['LÍA','De regreso veo un rumor sobre una compañera. Todos lo comparten. Antes lo habría reenviado.'],b:['LA BRÚJULA','Detente: ¿qué ocurre?, ¿qué razones tienes?, ¿cómo deberías actuar? Convierte la reflexión en una práctica responsable.'],q:'¿Cuál será tu siguiente paso?',opts:['Reenviar para no quedarme fuera','No difundir; verificar y buscar apoyo'],responses:['La popularidad no prueba la verdad. Reenviar puede causar daño: revisa la información primero.','La razón orienta la acción: frenar el rumor, verificar y buscar apoyo protege a quienes pueden resultar afectados.'],concept:'Praxis: acción vinculada con la reflexión. Observar, examinar razones y valorar la acción son pasos didácticos de esta aventura.'},\\n{era:'Mañana',date:'UN FUTURO POSIBLE · TU SIGUIENTE DECISIÓN',title:'El futuro necesita<br>tus preguntas.',type:'portal',a:['LÍA','Creía que viajar me daría todas las respuestas. Ahora tengo mejores preguntas.'],b:['LA BRÚJULA','La sabiduría no es acumular datos. Examina lo que crees y lo que haces. ¿Qué quieres comprender mejor en tu vida?'],q:'Elige la pregunta que te acompañará.',opts:['¿Qué significa vivir bien?','¿Qué puedo conocer?','¿Cómo construir una sociedad justa?'],responses:['Tu rumbo: la ética. Piensa qué hábitos y decisiones hacen una vida valiosa.','Tu rumbo: el conocimiento. Piensa qué evidencia cambiaría una creencia tuya.','Tu rumbo: la vida en común. Piensa cómo escuchar a quienes no suelen ser escuchados.'],concept:'No existe una respuesta automática a estas preguntas. Escribe tu reflexión en la bitácora.'},\\n{era:'Tu historia',date:'FIN DEL PRIMER VIAJE · INICIO DE TU REFLEXIÓN',title:'El tiempo cambia.<br>El asombro queda.',type:'temple',a:['LÍA','La brújula ya no brilla. Pero ahora sé cómo encenderla: preguntando.'],b:['TU TURNO','Elige una situación de tu entorno. Describe qué ocurre, cuestiona tus supuestos y propone una acción razonada.'],concept:'Adaptación educativa de “Filosofía: El papel de la f el <em>asombro.<\/em>',place:'Toda gran aventura comienza con una pregunta.',type:'portal'},\n{era:'Jonia',date:'SIGLO VI A. C. · EL MUNDO GRIEGO',title:'El mundo deja<br>de ser obvio.',type:'sea',a:['LÍA','Esta brújula no señala el norte… ¡se mueve cuando pregunto por qué!'],b:['LA BRÚJULA','Mira el mar. Puedes aceptar lo que te cuentan o buscar razones. El asombro abre la puerta a la filosofía.'],q:'¿Qué pregunta abre una investigación?',opts:['¿Qué explicación podemos examinar?','¿Qué debo repetir sin preguntar?'],responses:['Has encendido la brújula: preguntar y examinar razones inicia la indagación.','Repetir conserva una idea; examinarla te permite comprenderla. ¿Qué razones la sostienen?'],concept:'Filosofía: amor por la sabiduría. Esta parada explora la tradición griega; también existen otras tradiciones filosóficas.'},\n{era:'Atenas',date:'SIGLO V A. C. · EL ÁGORA',title:'Una pregunta<br>dentro de otra.',type:'temple',a:['LÍA','Sócrates, si todos dicen que algo es justo… ¿entonces lo es?'],b:['SÓCRATES · DIÁLOGO IMAGINADO','Primero dime: ¿qué entiendes por justicia? Después probemos tu idea con un ejemplo.'],q:'Un grupo excluye a una compañera. ¿Qué harías?',opts:['Aceptar porque lo decidió la mayoría','Preguntar por las razones y escucharla'],responses:['La mayoría puede equivocarse. Pregunta si la decisión respeta a cada persona.','Escuchar y pedir razones permite examinar la justicia de la decisión.'],concept:'La ética examina nuestras acciones. El diálogo filosófico busca razones y revisa lo que creemos saber.'},\n{era:'El archivo',date:'FUERA DEL TIEMPO · LA BIBLIOTECA DE LAS PREGUNTAS',title:'Cada puerta,<br>un misterio.',type:'library',a:['LÍA','¿La filosofía estudia una sola cosa?'],b:['LA GUARDIANA','Explora el conocimiento, el ser, nuestras acciones y la vida en común. Elige una puerta.'],q:'Toca una pregunta para descubrir su campo.',opts:['¿Cómo sé que es verdad?','¿Qué hace justa una acción?','¿Qué significa existir?','¿Cómo vivir juntos?'],responses:['Epistemología: examina el conocimiento, sus fundamentos y sus límites.','Ética: reflexiona sobre las acciones, los valores y la vida buena.','Ontología: pregunta por el ser y por lo que existe.','Filosofía política: examina el poder, la justicia y la vida en común.'],concept:'En la guía aparecen también psicología y sociología: hoy son disciplinas autónomas que dialogan con la filosofía.'},\n{era:'Las ideas',date:'ÉPOCA MODERNA · EL TALLER DE LAS IDEAS',title:'¿Pensar juntos<br>es pensar igual?',type:'press',a:['LÍA','Este manifiesto dice cómo debería vivir todo el mundo. ¿Eso es filosofía?'],b:['LA BRÚJULA','Una ideología organiza creencias y valores de un grupo. La filosofía puede examinar sus supuestos. Ambas pueden relacionarse; ninguna etiqueta reemplaza los argumentos.'],q:'Alguien piensa distinto a ti. Elige una respuesta.',opts:['“Explícame tus razones”','“Si no piensas como yo, estás mal”'],responses:['El respeto y el examen crítico pueden convivir. Comprender no obliga a estar de acuerdo.','Descalificar cierra el diálogo. Examina la idea y sus efectos sin atacar a la persona.'],concept:'Filosofía e ideología no son sinónimos. Una ideología no es automáticamente falsa; también puede someterse a crítica.'},\n{era:'El regreso',date:'PRESENTE · EL PATIO DEL COLEGIO',title:'La filosofía<br>sale del libro.',type:'school',a:['LÍA','De regreso veo un rumor sobre una compañera. Todos lo comparten. Antes lo habría reenviado.'],b:['LA BRÚJULA','Detente: ¿qué ocurre?, ¿qué razones tienes?, ¿cómo deberías actuar? Convierte la reflexión en una práctica responsable.'],q:'¿Cuál será tu siguiente paso?',opts:['Reenviar para no quedarme fuera','No difundir; verificar y buscar apoyo'],responses:['La popularidad no prueba la verdad. Reenviar puede causar daño: revisa la información primero.','La razón orienta la acción: frenar el rumor, verificar y buscar apoyo protege a quienes pueden resultar afectados.'],concept:'Praxis: acción vinculada con la reflexión. Observar, examinar razones y valorar la acción son pasos didácticos de esta aventura.'},\n{era:'Mañana',date:'UN FUTURO POSIBLE · TU SIGUIENTE DECISIÓN',title:'El futuro necesita<br>tus preguntas.',type:'portal',a:['LÍA','Creía que viajar me daría todas las respuestas. Ahora tengo mejores preguntas.'],b:['LA BRÚJULA','La sabiduría no es acumular datos. Examina lo que crees y lo que haces. ¿Qué quieres comprender mejor en tu vida?'],q:'Elige la pregunta que te acompañará.',opts:['¿Qué significa vivir bien?','¿Qué puedo conocer?','¿Cómo construir una sociedad justa?'],responses:['Tu rumbo: la ética. Piensa qué hábitos y decisiones hacen una vida valiosa.','Tu rumbo: el conocimiento. Piensa qué evidencia cambiaría una creencia tuya.','Tu rumbo: la vida en común. Piensa cómo escuchar a quienes no suelen ser escuchados.'],concept:'No existe una respuesta automática a estas preguntas. Escribe tu reflexión en la bitácora.'},\n{era:'Tu historia',date:'FIN DEL PRIMER VIAJE · INICIO DE TU REFLEXIÓN',title:'El tiempo cambia.<br>El asombro queda.',type:'temple',a:['LÍA','La brújula ya no brilla. Pero ahora sé cómo encenderla: preguntando.'],b:['TU TURNO','Elige una situación de tu entorno. Describe qué ocurre, cuestiona tus supuestos y propone una acción razonada.'],concept:'Adaptación educativa de “Filosofía: El papel de la filosofía”, grado 8.º, Lic. Henry Horacio Ruiz Ortiz (PDF aportado). Personajes, diálogos y viajes ficticios. Las escenas no son citas históricas.'}\n];\nfunction person(x,y,old=false){return `<g transform=\"translate(${x} ${y})\"><path d=\"M-43 125 Q-40 43 0 38 Q44 45 47 125Z\" fill=\"${old?'#d8caa8':'#a3553d'}\" stroke=\"#243c35\" stroke-width=\"3\"/><path d=\"M-22 48L20 116M14 44L-27 121\" fill=\"none\" stroke=\"${old?'#a28d68':'#dba87c'}\" stroke-width=\"3\"/><ellipse cy=\"13\" rx=\"24\" ry=\"30\" fill=\"#c89465\" stroke=\"#243c35\" stroke-width=\"3\"/>${old?'<path d=\"M-24 13Q-20 62 0 63Q25 42 24 14L15 24L0 20L-14 25Z\" fill=\"#d4ccb0\"/>':'<path d=\"M-24 18Q-40-25 1-24Q35-17 25 21L15 0Q-3 10-17-1Z\" fill=\"#26352d\"/>'}<path d=\"M-12 12h4m13 0h4\" stroke=\"#25382c\" stroke-width=\"3\"/><path d=\"M-4 23l5 1\" stroke=\"#76553b\"/><path d=\"M-28 69L-62 89M30 64L55 45\" stroke=\"#c89465\" stroke-width=\"12\" stroke-linecap=\"round\"/><\/g>`}\nfunction art(type,i){let decor='';if(type==='portal'){decor=`<g class=\"orbit\" fill=\"none\" stroke=\"#cdb47a\"><circle cx=\"300\" cy=\"280\" r=\"205\" stroke-width=\"2\"/><circle cx=\"300\" cy=\"280\" r=\"180\" stroke-dasharray=\"1 12\" stroke-width=\"10\"/><ellipse cx=\"300\" cy=\"280\" rx=\"125\" ry=\"205\" transform=\"rotate(35 300 280)\"/><ellipse cx=\"300\" cy=\"280\" rx=\"125\" ry=\"205\" transform=\"rotate(-35 300 280)\"/><\/g><circle cx=\"300\" cy=\"280\" r=\"143\" fill=\"#223e36\" stroke=\"#b69a61\"/><path d=\"M300 120L326 260L300 420L274 260Z\" fill=\"#c7a463\"/><path d=\"M165 280L300 253L435 280L300 305Z\" fill=\"#e8d7ae\"/><circle cx=\"300\" cy=\"280\" r=\"24\" fill=\"#20372f\" stroke=\"#d6b66b\"/><text x=\"300\" y=\"52\" text-anchor=\"middle\" fill=\"#d5ba7d\" font-family=\"Georgia\" font-size=\"18\">✦<\/text>`;}else if(type==='sea'){decor='<circle cx=\"415\" cy=\"130\" r=\"62\" fill=\"#d0ad66\"/><path d=\"M40 280Q160 195 280 280T560 280V480H40Z\" fill=\"#52766a\"/><path d=\"M40 325Q170 255 300 325T560 325M40 370Q160 310 280 370T560 370M40 415Q180 360 300 415T560 415\" fill=\"none\" stroke=\"#b9c3a0\" stroke-width=\"3\"/><path d=\"M345 273l90 0-22 20h-48Z\" fill=\"#172f2a\"/><path d=\"M387 267V173l-35 84Z\" fill=\"#ddd0a6\"/>';}else if(type==='temple'||type==='school'){decor=`<circle cx=\"430\" cy=\"130\" r=\"66\" fill=\"#c5a466\"/><path d=\"M90 190L300 78L510 190Z\" fill=\"#c5ba92\" stroke=\"#293c32\" stroke-width=\"5\"/><path d=\"M80 200H520M65 440H535M50 459H550\" stroke=\"#c5ba92\" stroke-width=\"15\"/>${[115,210,305,400,480].map(x=>`<path d=\"M${x} 216v210\" stroke=\"#bcad85\" stroke-width=\"31\"/><path d=\"M${x-6} 222v194\" stroke=\"#e4d3a8\" stroke-width=\"4\"/>`).join('')}`;}else{decor=`<path d=\"M75 470V120Q300-40 525 120V470Z\" fill=\"#b6a47c\"/><path d=\"M100 470V140Q300 10 500 140V470Z\" fill=\"#283e32\"/>${[180,270,360].map((y,j)=>`<path d=\"M105 ${y+55}H495\" stroke=\"#c8ad78\" stroke-width=\"9\"/>${Array.from({length:13},(_,k)=>`<rect x=\"${112+k*29}\" y=\"${y-30+(k%3)*8}\" width=\"21\" height=\"${80-(k%3)*8}\" fill=\"${['#a16b4b','#b7a57c','#688576'][k%3]}\"/><path d=\"M${119+k*29} ${y-20+(k%3)*8}v55\" stroke=\"#eadab2\" opacity=\".4\"/>`).join('')}`).join('')}`;}return `<svg viewBox=\"0 0 600 560\" role=\"img\" aria-label=\"Ilustración de ${scenes[i].era}: Lía atraviesa el tiempo\"><defs><pattern id=\"h${i}\" width=\"7\" height=\"7\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 7L7 0\" stroke=\"#d9c292\" opacity=\".08\"/><\/pattern><\/defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"520\" rx=\"270\" fill=\"#294237\" stroke=\"#d2b67955\"/>${decor}<path d=\"M20 490Q300 425 580 490V535H20Z\" fill=\"#b3a17a\"/>${person(type==='portal'?180:195,365)}${type!=='portal'?person(395,343,true):'<g class=\"float\"><path d=\"M390 387l27-47 26 47-26 47Z\" fill=\"#d5bc7d\"/><circle cx=\"417\" cy=\"387\" r=\"12\" fill=\"#274237\"/><\/g>'}<rect x=\"20\" y=\"20\" width=\"560\" height=\"520\" rx=\"270\" fill=\"url(#h${i})\"/><path d=\"M60 520H540\" stroke=\"#dac393\"/><text x=\"300\" y=\"553\" text-anchor=\"middle\" fill=\"#d2bc8b\" font-family=\"Georgia\" font-size=\"12\" letter-spacing=\"5\">${['I','II','III','IV','V','VI','VII','VIII'][i]} · ${scenes[i].era.toUpperCase()}<\/text><\/svg>`}\nconst feed=document.querySelector('#feed');let current=0;let state={answers:{},note:''};try{state=JSON.parse(localStorage.getItem('cronicas-v1'))||state}catch(e){}if(!state.answers)state.answers={};\nfeed.innerHTML=scenes.map((s,i)=>`<section id=\"scene${i}\" class=\"${i===0?'cover':''}\" aria-label=\"Escena ${i+1}: ${s.era}\"><div class=\"layout\"><div><div class=\"eyebrow\">${s.date}<\/div>${i===0?`<h1>${s.title}<\/h1><p class=\"intro\">Una estudiante. Una brújula imposible.<br>Un viaje hacia las preguntas que nos hacen humanos.<\/p><button class=\"primary\" data-go=\"1\">Abrir el portal &nbsp; ↓<\/button><p class=\"sub\">8 escenas · Filosofía para grado 8.º<br>Desliza hacia arriba, usa la rueda o las flechas.<\/p>`:`<h2>${s.title}<\/h2><div class=\"speech\"><strong>${s.a[0]}<\/strong>${s.a[1]}<\/div><div class=\"speech other\"><strong>${s.b[0]}<\/strong>${s.b[1]}<\/div>${s.opts?`<div class=\"choice\"><p>${s.q}<\/p><div class=\"options\">${s.opts.map((o,k)=>`<button data-scene=\"${i}\" data-option=\"${k}\" aria-pressed=\"false\">${o}<\/button>`).join('')}<\/div><div class=\"feedback\" id=\"feedback${i}\" aria-live=\"polite\"><\/div><\/div>`:`<button class=\"primary\" id=\"finish\">Escribir mi reflexión ↗<\/button><button class=\"quiet\" data-go=\"0\">Volver al inicio<\/button>`}<p class=\"sub\">${s.concept}<\/p>`}<\/div><div class=\"art\">${art(s.type,i)}<div class=\"caption\">${i===0?s.place:'Una aventura en ocho fragmentos · Ilustración original'}<\/div><\/div><\/div><\/section>`).join('');\nconst rail=document.querySelector('#rail');rail.innerHTML=scenes.map((s,i)=>`<button data-go=\"${i}\" aria-label=\"Ir a ${s.era}\" title=\"${s.era}\"><\/button>`).join('');document.querySelector('#stops').innerHTML=scenes.map((s,i)=>`<button data-go=\"${i}\"><b>0${i+1} · ${s.era}<\/b><br><small>${s.date}<\/small><\/button>`).join('');\nfunction go(i){document.querySelector('#scene'+Math.max(0,Math.min(7,i))).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.querySelector('#map').close()}\nfunction save(){try{localStorage.setItem('cronicas-v1',JSON.stringify(state));document.querySelector('#saveStatus').textContent='Guardado en este navegador.'}catch(e){document.querySelector('#saveStatus').textContent='Guardado temporalmente. Descarga tu bitácora antes de cerrar.'}}\nfunction choose(i,k,persist=true){state.answers[i]=k;document.querySelector('#feedback'+i).textContent=scenes[i].responses[k];document.querySelectorAll(`[data-scene=\"${i}\"]`).forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.option===k)));if(persist)save()}\nObject.entries(state.answers).forEach(([i,k])=>{if(scenes[i]?.opts?.[k])choose(+i,+k,false)});\ndocument.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)go(+b.dataset.go);if(b.dataset.option!==undefined)choose(+b.dataset.scene,+b.dataset.option);if(b.hasAttribute('data-close'))b.closest('dialog').close()});\nconst observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){current=+e.target.id.replace('scene','');document.querySelector('#count').textContent=`0${current+1} / 08`;document.querySelector('#era').textContent=scenes[current].era.toUpperCase();document.querySelector('#bar').style.width=((current+1)/8*100)+'%';rail.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('active',i===current);if(i===current)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===7}})},{root:feed,threshold:.55});document.querySelectorAll('section').forEach(s=>observer.observe(s));\ndocument.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);document.querySelector('#mapBtn').onclick=()=>document.querySelector('#map').showModal();function book(){document.querySelector('#memories').replaceChildren();const p=document.createElement('p');p.textContent=`Has explorado ${Object.keys(state.answers).length} de 6 decisiones. Puedes volver a cualquier época para cambiar tu elección.`;document.querySelector('#memories').append(p);document.querySelector('#book').showModal()}document.querySelector('#bookBtn').onclick=book;document.querySelector('#finish').onclick=book;const note=document.querySelector('#note');note.value=state.note||'';note.oninput=()=>{state.note=note.value;save()};\ndocument.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||/TEXTAREA|INPUT|BUTTON/.test(e.target.tagName))return;if(['ArrowDown','PageDown','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current+(['ArrowDown','PageDown'].includes(e.key)?1:-1))}});\ndocument.querySelector('#download').onclick=()=>{const text=['CRÓNICAS DEL ASOMBRO — MI BITÁCORA',new Date().toLocaleString('es-CO'),'',...Object.entries(state.answers).map(([i,k])=>scenes[i].era+'\\n'+scenes[i].q+'\\nMi elección: '+scenes[i].opts[k]+'\\n'+scenes[i].responses[k]+'\\n'),'MI REFLEXIÓN',state.note||'(Sin reflexión escrita)'].join('\\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Mi_bitacora_filosofica.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};\n<\/script><\/body><\/html>\n";
const KEY='filosofia-vida-curso-v1';let state={version:1,read:{},notes:{},checks:{},quiz:{},quizResults:{},lab:{},font:0};let persistOK=true;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1)state={...state,...saved}}catch(e){persistOK=false}for(const k of ['read','notes','checks','quiz','quizResults','lab'])if(!state[k]||typeof state[k]!=='object')state[k]={};let current={route:'inicio',id:1,tab:'estudiar'};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persistOK=true;$('#status').textContent='Guardado en este navegador · sin envío al docente'}catch(e){persistOK=false;$('#status').textContent='Guardado temporal: descarga un respaldo antes de cerrar'}}function status(){if(!persistOK)$('#status').textContent='Guardado temporal: descarga un respaldo antes de cerrar'}status();function applyFont(){document.documentElement.style.setProperty('--body',state.font?'19px':'17px');$('#fontButton').textContent=state.font?'A−':'A+'}applyFont();$('#fontButton').onclick=()=>{state.font=state.font?0:1;applyFont();save()};
function progress(m){const read=m.lessons.filter((_,i)=>state.read[m.id+'-'+i]).length;const notes=m.practice.prompts.filter((_,i)=>(state.notes[m.id+'-'+i]||'').trim()).length;const quiz=state.quizResults[m.id]?.completed?1:0;const total=m.lessons.length+m.practice.prompts.length+1;return {read,notes,quiz,percent:Math.round((read+notes+quiz)/total*100)}}function allProgress(){const ps=MODULES.map(progress);return Math.round(ps.reduce((a,x)=>a+x.percent,0)/6)}function jump(route){if(location.hash==='#'+route){render();window.scrollTo(0,0)}else location.hash=route}function setFocus(){const h=$('#mainStart');if(h)h.focus({preventScroll:true})}window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);setFocus()});document.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b)jump(b.dataset.route)});window.addEventListener('message',e=>{if(e.source===$('#homeFrame')?.contentWindow&&e.data?.type==='open-course')jump('mapa')});
function render(){if('speechSynthesis'in window)speechSynthesis.cancel();const bits=location.hash.slice(1).split('/');const route=bits[0]||'inicio';current.route=route;document.querySelectorAll('.topnav [data-route]').forEach(b=>{if(b.dataset.route===route)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(route==='inicio')home();else if(route==='mapa')map();else if(route==='modulo'){const id=Number(bits[1]);if(!MODULES.some(x=>x.id===id)){jump('mapa');return}current.id=id;current.tab=['estudiar','explorar','practicar','comprobar','ampliar'].includes(bits[2])?bits[2]:'estudiar';modulePage()}else if(route==='portafolio')portfolio();else if(route==='guia')guide();else{jump('mapa')}}
function home(){$('#app').innerHTML='<iframe id="homeFrame" class="homeframe" title="Página de inicio de Filosofía para la vida"></iframe>';$('#homeFrame').srcdoc=HOME_SOURCE}
function map(){const pct=allProgress();$('#app').innerHTML=`<div class="wrap"><div class="route-head"><div><div class="tag">Tu ruta de aprendizaje</div><h1 id="mainStart" tabindex="-1">Seis módulos.<br><em style="color:var(--gold)">Muchas formas de mirar.</em></h1><p class="intro">Del asombro a la acción: un curso para preguntar mejor, examinar razones y convivir con otras miradas.</p><div class="meta"><span class="pill">36 lecciones</span><span class="pill">32 horas orientativas</span><span class="pill">6 laboratorios</span><span class="pill">24 preguntas de autoevaluación</span></div></div><div class="seal" aria-hidden="true">✦</div></div><p class="hint">Ruta flexible: comienza por el módulo 1 o abre el tema que quieras revisar. Cada módulo incluye teoría, laboratorio, caso, práctica, autoevaluación y lecturas. Las horas son una propuesta de trabajo, no una duración oficial.</p><div class="note-box"><b>Tu avance de trabajo: ${pct}%</b><div class="track" role="progressbar" aria-label="Avance del curso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div><span class="hint">Se cuentan lecturas que marcas, campos de práctica escritos y autoevaluaciones terminadas. No es una nota ni certifica dominio. Revisa la calidad con la rúbrica.</span></div><div class="cards">${MODULES.map(m=>{const p=progress(m);return `<article class="modulecard"><span class="glyph" aria-hidden="true">${m.icon}</span><div class="tag">Módulo 0${m.id}</div><h2>${m.title}</h2><p>${m.intro}</p><span class="hint">${m.hours} · 6 lecciones</span><div class="track"><span style="width:${p.percent}%"></span></div><p class="hint">${p.percent}% de trabajo registrado</p><button class="primary" data-route="modulo/${m.id}/estudiar">${p.percent?'Continuar':'Explorar el módulo'} ↗</button></article>`}).join('')}</div><div class="note-box"><h3>Un portafolio, no una carrera.</h3><p>Al terminar tendrás seis productos: una ficha de pregunta, una escena filosófica, una verificación, una deliberación ética, un diálogo sobre identidad y un proyecto de acción.</p><div class="actions"><button data-route="guia">Ver metodología y rúbrica</button><button data-route="portafolio">Abrir mi portafolio</button></div></div></div>`}
function modulePage(){const m=MODULES[current.id-1],p=progress(m);$('#app').innerHTML=`<div class="course-grid"><aside class="side" aria-label="Módulos"><p class="tag">Atlas del curso</p><div class="side-links">${MODULES.map(x=>`<button data-route="modulo/${x.id}/estudiar" class="${x.id===m.id?'current':''}" ${x.id===m.id?'aria-current="page"':''}>0${x.id} · ${x.title}</button>`).join('')}</div><div class="side-extra"><h2>Tu avance</h2><div class="track"><span style="width:${p.percent}%"></span></div><p class="hint" id="sideProgress">${p.read}/6 lecturas · ${p.notes}/${m.practice.prompts.length} campos de práctica · ${p.quiz?1:0}/1 autoevaluación</p><button data-route="portafolio">Descargar mi trabajo ↓</button><p class="hint">Todo se guarda en este navegador. Para cambiar de dispositivo, descarga e importa un respaldo JSON.</p></div></aside><article class="content"><p class="tag">Módulo 0${m.id} / 06</p><h1 id="mainStart" tabindex="-1">${m.title}</h1><p class="intro">${m.subtitle}</p><p>${m.intro}</p><div class="meta"><span class="pill">${m.hours}</span><span class="pill">Trabajo individual y diálogo</span></div><div class="objectives"><b>Al finalizar podrás…</b><ul>${m.objectives.map(x=>`<li>${x}</li>`).join('')}</ul></div><nav class="tabs" aria-label="Secciones del módulo">${[['estudiar','01 · Teoría'],['explorar','02 · Laboratorio'],['practicar','03 · Práctica'],['comprobar','04 · Autoevaluación'],['ampliar','05 · Ampliación']].map(([key,label])=>`<button data-route="modulo/${m.id}/${key}" aria-pressed="${current.tab===key}">${label}</button>`).join('')}</nav><div id="moduleBody"></div><div class="footer-actions"><button data-route="${m.id===1?'mapa':'modulo/'+(m.id-1)+'/estudiar'}">← ${m.id===1?'Mapa del curso':'Módulo anterior'}</button><button class="primary" data-route="${m.id===6?'portafolio':'modulo/'+(m.id+1)+'/estudiar'}">${m.id===6?'Revisar mi portafolio':'Siguiente módulo'} →</button></div></article></div>`;({estudiar:theory,explorar:lab,practicar:practice,comprobar:quiz,ampliar:resources}[current.tab])(m)}
function theory(m){$('#moduleBody').innerHTML=`<p class="hint">Lee por partes. Tras cada lección escribe mentalmente un ejemplo propio antes de marcarla. Escuchar usa la voz disponible en tu navegador; si no funciona, el texto completo permanece visible.</p><div class="toc">${m.lessons.map((l,i)=>`<a href="#lesson${i}" data-anchor="lesson${i}">${l.title}</a>`).join('')}</div>${m.lessons.map((l,i)=>`<section class="lesson" id="lesson${i}"><h2>${l.title}</h2>${l.paragraphs.map(p=>`<p>${p}</p>`).join('')}<div class="actions"><button class="lessonmark" data-read="${m.id}-${i}" aria-pressed="${!!state.read[m.id+'-'+i]}">${state.read[m.id+'-'+i]?'✓ Lectura marcada':'Marcar lectura realizada'}</button><button data-listen="${i}">▷ Escuchar</button><button data-stop>Detener audio</button></div></section>`).join('')}<div class="actions"><button class="primary" data-route="modulo/${m.id}/explorar">Pasar al laboratorio →</button></div>`;document.querySelectorAll('[data-anchor]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.anchor).scrollIntoView({behavior:reduced()?'instant':'smooth'})});document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{state.read[b.dataset.read]=!state.read[b.dataset.read];b.setAttribute('aria-pressed',!!state.read[b.dataset.read]);b.textContent=state.read[b.dataset.read]?'✓ Lectura marcada':'Marcar lectura realizada';save();updateSide(m)});document.querySelectorAll('[data-listen]').forEach(b=>b.onclick=()=>{if(!('speechSynthesis'in window)){ $('#status').textContent='Este navegador no ofrece lectura en voz alta. Usa el texto de la lección.';return}speechSynthesis.cancel();const l=m.lessons[+b.dataset.listen];const utter=new SpeechSynthesisUtterance(l.title+'. '+l.paragraphs.join(' '));utter.lang='es-CO';utter.rate=.92;utter.onerror=()=>$('#status').textContent='La voz no está disponible. Puedes continuar leyendo el texto.';speechSynthesis.speak(utter)});document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()})}
function updateSide(m){const p=progress(m);const t=$('#sideProgress');if(t)t.textContent=`${p.read}/6 lecturas · ${p.notes}/${m.practice.prompts.length} campos de práctica · ${p.quiz}/1 autoevaluación`;const bar=$('.side .track span');if(bar)bar.style.width=p.percent+'%'}
function field(key,label,placeholder='Escribe tu respuesta con razones y ejemplos…'){return `<div class="field"><label for="n-${key}">${esc(label)}</label><textarea id="n-${key}" data-note="${key}" placeholder="${esc(placeholder)}">${esc(state.notes[key]||'')}</textarea></div>`}function bindFields(m){document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{state.notes[t.dataset.note]=t.value;save();if(m)updateSide(m)})}
function practice(m){$('#moduleBody').innerHTML=`<section class="case"><p class="tag">Caso para examinar</p><h2>${m.case.title}</h2><div class="note-box">${m.case.text}</div><ol>${m.case.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${field(m.id+'-case','Mi análisis del caso')}<details><summary>Comparar con una orientación de respuesta</summary><p>${m.case.model}</p><p class="hint">Es una orientación, no la única respuesta aceptable. Compara la calidad de las razones.</p></details></section><section class="practice"><p class="tag">Producto del módulo</p><h2>${m.practice.title}</h2><ol>${m.practice.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="hint">Puedes trabajar en cuaderno y luego registrar una síntesis. No incluyas datos personales de otras personas. Las respuestas abiertas requieren revisión propia o docente: no se califican automáticamente.</p>${m.practice.prompts.map((p,i)=>field(m.id+'-'+i,p)).join('')}<h3>Revisa antes de entregar</h3><div class="checks">${m.practice.criteria.map((c,i)=>`<label><input type="checkbox" data-check="${m.id}-${i}" ${state.checks[m.id+'-'+i]?'checked':''}>${c}</label>`).join('')}</div><div class="actions"><button class="primary" data-route="portafolio">Revisar y descargar mis respuestas</button><button data-route="modulo/${m.id}/comprobar">Ir a la autoevaluación →</button></div></section>`;bindFields(m);document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{state.checks[c.dataset.check]=c.checked;save()})}
function quiz(m){$('#moduleBody').innerHTML=`<h2>Comprueba los conceptos</h2><p>Responde las cuatro preguntas. Recibirás explicación de cada respuesta. Puedes modificar tus elecciones y volver a comprobar; se guarda el último resultado. Esta autoevaluación no califica tus posturas personales ni reemplaza la práctica.</p><form id="quizForm">${m.quiz.map((q,i)=>`<fieldset class="question"><legend>${i+1}. ${q.q}</legend>${q.opts.map((o,k)=>`<label><input type="radio" name="q${i}" value="${k}" ${state.quiz[m.id+'-'+i]===k?'checked':''}><span>${o}</span></label>`).join('')}<div id="qfeed${i}"></div></fieldset>`).join('')}<div class="quiz-end"><button class="primary" type="submit">Comprobar respuestas</button><button type="button" id="retry">Nuevo intento</button></div></form><div id="quizResult" aria-live="polite"></div>`;$('#quizForm').onchange=e=>{if(e.target.type==='radio'){state.quiz[m.id+'-'+e.target.name.slice(1)]=+e.target.value;delete state.quizResults[m.id];$('#quizResult').textContent='Respuestas modificadas. Pulsa Comprobar para actualizar el resultado.';m.quiz.forEach((_,i)=>$('#qfeed'+i).replaceChildren());save();updateSide(m)}};$('#quizForm').onsubmit=e=>{e.preventDefault();checkQuiz(m)};$('#retry').onclick=()=>{m.quiz.forEach((_,i)=>delete state.quiz[m.id+'-'+i]);delete state.quizResults[m.id];save();quiz(m);updateSide(m)};if(state.quizResults[m.id]?.completed)showQuiz(m)}
function checkQuiz(m){const missing=m.quiz.findIndex((q,i)=>!Number.isInteger(state.quiz[m.id+'-'+i]));if(missing>=0){$('#quizResult').innerHTML='<p class="result">Falta responder la pregunta '+(missing+1)+'.</p>';document.querySelector(`[name=q${missing}]`).focus();return}const score=m.quiz.reduce((a,q,i)=>a+(state.quiz[m.id+'-'+i]===q.answer?1:0),0);state.quizResults[m.id]={completed:true,score,date:new Date().toISOString()};save();showQuiz(m);updateSide(m)}function showQuiz(m){m.quiz.forEach((q,i)=>{const ok=state.quiz[m.id+'-'+i]===q.answer;$('#qfeed'+i).innerHTML=`<div class="feedback"><b>${ok?'✓ Respuesta adecuada.':'↺ Revisa este concepto.'}</b> ${q.why}<br><span>Respuesta de referencia: ${q.opts[q.answer]}</span></div>`});const score=state.quizResults[m.id].score;$('#quizResult').innerHTML=`<div class="result"><h3>${score} de 4 conceptos identificados</h3><p>${score===4?'Buen trabajo. Ahora aplica estos conceptos a un caso y considera una objeción.':'Revisa las explicaciones y vuelve a las lecciones que necesites. Puedes repetir sin penalización.'}</p><p class="hint">Resultado de práctica, no nota oficial.</p></div>`}
function resources(m){$('#moduleBody').innerHTML=`<h2>Una puerta para seguir aprendiendo</h2><p>Estos recursos externos se ofrecen como ampliación. El contenido principal del módulo está dentro del HTML. Los enlaces requieren Internet y se abren en otra pestaña; algunos documentos extensos conviene leerlos con apoyo docente.</p>${m.resources.map(r=>`<article class="resource"><span class="pill">${r.level}</span><h3><a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.title} ↗</a></h3><p><b>Ruta de lectura:</b> ${r.guide}</p><p class="hint">Página pública consultada el 17 de octubre de 2026. La disponibilidad de sitios externos puede cambiar.</p></article>`).join('')}${field(m.id+'-resource','Mi ampliación: recurso consultado, una idea nueva y una pregunta','Anota el título y enlace, explica la idea con tus palabras y escribe qué quisieras profundizar.')}<details><summary>Cómo citar una lectura sin copiarla</summary><p>Registra institución o autor, título, enlace y fecha de consulta. Explica las ideas con tus palabras y distingue lo que plantea la fuente de tu interpretación. Si incluyes palabras exactas, usa comillas y señala su procedencia.</p></details>`;bindFields(m)}
function lab(m){const bodies={
1:`<h2>El taller de las preguntas</h2><p>Clasifica estas preguntas por su propósito principal. Una situación puede combinar datos y reflexión; explica después cómo se relacionan.</p><div id="classify"></div><button class="primary" id="checkClass">Revisar clasificación</button><div id="labFeedback" class="feedback" aria-live="polite">Selecciona una categoría para cada pregunta.</div><h3>El mapa de los conceptos</h3><p>Toca un campo y descubre una pregunta que puedes llevar a tu vida.</p><div class="concepts">${['Ética','Epistemología','Lógica','Estética','Filosofía política'].map((t,i)=>`<button data-concept="${i}">${t}</button>`).join('')}</div><div id="conceptFeedback" class="feedback" aria-live="polite">Elige un campo filosófico.</div>`,
2:`<h2>Abre la brújula del tiempo</h2><p>Primero recorre la historieta. Después explora cómo cambia una interpretación cuando aparece información nueva.</p><button class="primary" id="launchStory">Abrir Crónicas del asombro ↗</button><h3>La escena incompleta</h3><svg class="diagram" viewBox="0 0 640 270" role="img" aria-label="Escena ilustrada que permite revelar el contexto de un balón junto a un recipiente"><rect width="640" height="270" rx="10" fill="#213b32"/><path d="M0 225H640" stroke="#d7b66f"/><g id="sceneContext" opacity="0"><rect x="390" y="135" width="65" height="90" rx="5" fill="#c9bd95"/><text x="422" y="164" text-anchor="middle" fill="#20332f" font-size="11">BALONES</text><circle cx="505" cy="101" r="20" fill="#c89465"/><path d="M482 130h46l12 90h-70Z" fill="#ac7951"/><path d="M480 146L395 172" stroke="#c89465" stroke-width="12" stroke-linecap="round"/></g><circle cx="350" cy="174" r="29" fill="#d7b66f" stroke="#efe3c9" stroke-width="3"/><path d="M325 174h50M350 146v56" stroke="#253e32" stroke-width="2"/><text x="30" y="42" fill="#efe3c9" font-size="15">¿Qué está pasando aquí?</text></svg><label for="contextRange">Contexto visible: <span id="contextValue">0%</span></label><input id="contextRange" type="range" min="0" max="100" value="0"><div id="contextText" class="feedback" aria-live="polite">Solo ves un balón. ¿Está cayendo, volando o siendo guardado? La imagen no permite decidirlo.</div><p class="hint">Escena ficticia diseñada para mostrar los límites de una inferencia visual; no es una reconstrucción de la caverna de Platón.</p>`,
3:`<h2>Construye y examina un argumento</h2><p>Coloca cada afirmación en su función. Luego comprueba si la forma del razonamiento es adecuada.</p><label for="prem1">Premisa general</label><select id="prem1"><option value="">Selecciona…</option><option value="a">Todo material prestado debe devolverse según el acuerdo.</option><option value="b">Debo devolver este material según el acuerdo.</option><option value="c">Este material me fue prestado.</option></select><label for="prem2">Premisa particular</label><select id="prem2"><option value="">Selecciona…</option><option value="a">Todo material prestado debe devolverse según el acuerdo.</option><option value="b">Debo devolver este material según el acuerdo.</option><option value="c">Este material me fue prestado.</option></select><label for="conclusion">Conclusión</label><select id="conclusion"><option value="">Selecciona…</option><option value="a">Todo material prestado debe devolverse según el acuerdo.</option><option value="b">Debo devolver este material según el acuerdo.</option><option value="c">Este material me fue prestado.</option></select><div class="actions"><button class="primary" id="checkArgument">Examinar estructura</button></div><div id="argFeedback" class="feedback" aria-live="polite">Reconoce las razones y lo que intentan sostener.</div><h3>Detecta la dificultad</h3><p>“A Laura no le gusta el deporte, por eso su propuesta para organizar la biblioteca es mala”.</p><div class="options"><button data-fallacy="0">El gusto deportivo no evalúa la propuesta.</button><button data-fallacy="1">La propuesta es falsa con seguridad.</button><button data-fallacy="2">No hay ningún problema.</button></div><div id="fallacyFeedback" class="feedback" aria-live="polite">Selecciona un análisis.</div>`,
4:`<h2>Un dilema, tres lentes</h2><p>Tu amigo no terminó una tarea y pide copiar la tuya. Dice que negarte demostraría que no eres buen amigo. Explora cada lente antes de decidir.</p><div class="mode-steps"><button data-lens="0">Consecuencias</button><button data-lens="1">Deberes y respeto</button><button data-lens="2">Cuidado y virtudes</button></div><div id="lensFeedback" class="feedback" aria-live="polite">¿Qué aspectos de la situación podrías estar dejando fuera?</div><h3>Elige una acción para examinarla</h3><div class="options"><button data-ethic="0">Entregar mi tarea para copiar.</button><button data-ethic="1">Negarme y ridiculizarlo.</button><button data-ethic="2">Ofrecer ayuda para comprender.</button></div><div id="ethicFeedback" class="feedback" aria-live="polite">Cada opción tiene implicaciones; analiza sus razones.</div><p class="hint">Esto no es una calculadora moral. En la práctica escrita justificarás una decisión y responderás a una objeción.</p>`,
5:`<h2>El mensaje bajo la lupa</h2><p>Anuncio ficticio: “Las personas auténticas usan la mochila Nova. Si no la tienes, nunca encajarás. Todo el mundo ya la compró”.</p><div class="options"><button data-message="0">“Las personas auténticas…”</button><button data-message="1">“Nunca encajarás…”</button><button data-message="2">“Todo el mundo…”</button></div><div id="messageFeedback" class="feedback" aria-live="polite">Toca cada fragmento para examinar su supuesto.</div><h3>Reformula sin imponer pertenencia</h3><p>¿Cuál alternativa describe mejor un producto sin convertirlo en medida de una persona?</p><div class="options"><button data-ad="0">“Solo vales si la tienes”.</button><button data-ad="1">“Tiene tres compartimentos; comprueba si responde a tus necesidades”.</button><button data-ad="2">“Quien no la compre no piensa”.</button></div><div id="adFeedback" class="feedback" aria-live="polite">Compara descripción, promesa y presión.</div>`,
6:`<h2>Del problema a una prueba pequeña</h2><p>Ordena el proceso. Los botones permiten mover cada paso sin arrastrar, también desde un teléfono o teclado.</p><div id="orderList"></div><button class="primary" id="checkOrder">Revisar secuencia</button><div id="orderFeedback" class="feedback" aria-live="polite">Una secuencia razonada conecta diagnóstico, acción y revisión.</div><h3>¿Actividad o resultado?</h3><p>Se crearon 20 afiches para explicar el préstamo de libros. ¿Qué dato ayudaría más a valorar si se comprendió el procedimiento?</p><div class="options"><button data-indicator="0">La cantidad de colores del afiche.</button><button data-indicator="1">Cuántas personas explican correctamente los pasos.</button><button data-indicator="2">El tamaño del título.</button></div><div id="indicatorFeedback" class="feedback" aria-live="polite">Elige un indicador relacionado con el objetivo.</div>`};$('#moduleBody').innerHTML=`<p class="tag">Aprender haciendo</p><div class="lab">${bodies[m.id]}</div>${field(m.id+'-lab','Mi conclusión del laboratorio','¿Qué observaste, qué cambió en tu interpretación y qué pregunta queda abierta?')}<div class="actions"><button class="primary" data-route="modulo/${m.id}/practicar">Aplicarlo a un caso →</button></div>`;bindFields(m);function buttons(attr,target,arr){document.querySelectorAll('['+attr+']').forEach(b=>b.onclick=()=>{document.querySelectorAll('['+attr+']').forEach(x=>x.setAttribute('aria-pressed',x===b));$(target).textContent=arr[+b.getAttribute(attr)];state.lab[attr]=+b.getAttribute(attr);save()})}if(m.id===1){const qs=['¿A qué hora abre la biblioteca?','¿Qué hace justa una norma?','¿Cuántos libros se prestaron ayer?','¿Puede la popularidad demostrar la verdad?'];$('#classify').innerHTML=qs.map((q,i)=>`<label for="cl${i}">${q}</label><select id="cl${i}"><option value="">Selecciona…</option><option value="dato">Pregunta de datos</option><option value="filo">Pregunta filosófica</option></select>`).join('');$('#checkClass').onclick=()=>{const vals=qs.map((_,i)=>$('#cl'+i).value);if(vals.includes('')){$('#labFeedback').textContent='Completa las cuatro categorías antes de revisar.';return}const right=['dato','filo','dato','filo'];const n=vals.reduce((a,v,i)=>a+(v===right[i]),0);$('#labFeedback').textContent=`${n}/4 categorías coinciden con el propósito principal. Horarios y cantidades se contrastan con registros. Justicia y relación entre popularidad y verdad exigen examinar criterios y razones. Una investigación puede combinar ambos tipos.`;state.lab.classify=vals;save()};buttons('data-concept','#conceptFeedback',['Ética: ¿qué responsabilidad tengo cuando un mensaje puede perjudicar a alguien?','Epistemología: ¿qué evidencia justificaría creer ese mensaje?','Lógica: ¿las razones ofrecidas realmente apoyan la conclusión?','Estética: ¿qué criterios uso para interpretar una obra como arte?','Filosofía política: ¿quién participa en una decisión que afecta a todos?'])}
if(m.id===2){$('#launchStory').onclick=openStory;$('#contextRange').oninput=e=>{const v=+e.target.value;$('#sceneContext').setAttribute('opacity',v/100);$('#contextValue').textContent=v+'%';$('#contextText').textContent=v<35?'Solo se aprecia una parte de la escena. Varias explicaciones siguen siendo posibles.':v<80?'Empieza a aparecer una persona y un recipiente. Revisa tu primera explicación sin dar por cierto todo lo que imaginas.':'Ahora ves una persona junto a un recipiente marcado “BALONES”. Guardar el balón es una interpretación más plausible, pero una imagen fija aún no demuestra cada intención ni el movimiento anterior.'}}
if(m.id===3){$('#checkArgument').onclick=()=>{const a=[$('#prem1').value,$('#prem2').value,$('#conclusion').value];$('#argFeedback').textContent=a.includes('')?'Selecciona las tres afirmaciones.':a.join('')==='acb'?'La estructura conecta una regla general y un caso particular con la conclusión. Aún podríamos examinar el contenido y las condiciones del acuerdo: la estructura no elimina esas preguntas.':'Revisa qué afirmación contiene la regla, cuál describe el caso y cuál expresa lo que se debe hacer. Orden esperado: regla general, material prestado, devolución.';state.lab.argument=a;save()};buttons('data-fallacy','#fallacyFeedback',['La crítica se dirige a un gusto de Laura que no es pertinente para valorar la propuesta. Hay que examinar la propuesta misma.','El argumento es defectuoso, pero eso no demuestra que la propuesta sea falsa o mala. Podría haber otras razones a favor o en contra.','Sí existe una dificultad: no se explica por qué el gusto deportivo determina la calidad de una propuesta sobre la biblioteca.'])}
if(m.id===4){buttons('data-lens','#lensFeedback',['Consecuencias: copiar podría resolver el apuro inmediato, pero impedir aprendizaje y afectar la confianza. ¿Qué ocurre después?','Deberes y respeto: considera la honestidad del trabajo y el trato digno. La amistad no exige fingir que un trabajo ajeno es propio.','Cuidado y virtudes: ayudar a comprender puede expresar amistad y honestidad. También puedes escuchar qué dificultad impidió terminar.']);buttons('data-ethic','#ethicFeedback',['Puede evitar una tensión inmediata, pero no apoya la autoría ni el aprendizaje. ¿Hay una alternativa que ayude sin sustituir su trabajo?','Negarse puede ser razonable; ridiculizar añade un daño innecesario. Separa el límite que quieres poner de la manera de comunicarlo.','Esta alternativa intenta cuidar la amistad y el aprendizaje. Aclara cuánto puedes ayudar y evita terminar haciendo el trabajo por la otra persona.'])}
if(m.id===5){buttons('data-message','#messageFeedback',['Asocia autenticidad con consumo sin justificar la relación. Tener un objeto no define por sí solo quién eres.','Activa el temor a quedar fuera y presenta una predicción absoluta sin evidencia. Examina si pertenecer realmente depende de esa compra.','Apela a la popularidad y hace una afirmación general que necesitaría pruebas. Aunque fuera popular, no demostraría que lo necesitas.']);buttons('data-ad','#adFeedback',['Convierte el valor de una persona en condición de compra. No describe una característica verificable del producto.','Describe una característica que se puede comprobar y deja espacio para una decisión según necesidades. Todavía debes verificar que sea verdadera.','Descalifica a quien no compra y evita dar razones pertinentes sobre el producto.'])}
if(m.id===6){let order=Array.isArray(state.lab.order)&&state.lab.order.length===5&&new Set(state.lab.order).size===5&&state.lab.order.every(x=>Number.isInteger(x)&&x>=0&&x<5)?state.lab.order.slice():[3,0,4,2,1];const labels=['Delimitar una pregunta y el contexto.','Escuchar perspectivas y reunir información.','Comparar alternativas y diseñar una acción.','Realizar una prueba acordada y registrar lo ocurrido.','Evaluar resultados, límites y posibles ajustes.'];function orderDraw(){$('#orderList').innerHTML=order.map((id,i)=>`<div class="output"><b>${i+1}. ${labels[id]}</b><div class="actions"><button data-move="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="Subir paso ${i+1}">↑ Subir</button><button data-move="${i}" data-dir="1" ${i===4?'disabled':''} aria-label="Bajar paso ${i+1}">↓ Bajar</button></div></div>`).join('');document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const i=+b.dataset.move,j=i+(+b.dataset.dir);[order[i],order[j]]=[order[j],order[i]];state.lab.order=order;save();orderDraw();const f=document.querySelector(`[data-move="${j}"]:not(:disabled)`);if(f)f.focus()})}orderDraw();$('#checkOrder').onclick=()=>{$('#orderFeedback').textContent=order.every((x,i)=>x===i)?'La secuencia es coherente. En la práctica puedes volver a pasos anteriores si aparece nueva información; no es una cadena rígida.':'Revisa la relación: delimitar → escuchar → comparar y diseñar → probar → evaluar. No puedes evaluar resultados observados de una acción que aún no realizaste.'};buttons('data-indicator','#indicatorFeedback',['Los colores describen el material, pero no indican si las personas comprendieron el préstamo.','La explicación de los pasos aporta evidencia sobre comprensión. Conviene comparar con una situación inicial y reconocer límites de la prueba.','El tamaño puede afectar legibilidad, pero no demuestra por sí solo comprensión. Relaciona el indicador con el objetivo.'])}}
function openStory(){if(!$('#storyFrame').srcdoc)$('#storyFrame').srcdoc=STORY_SOURCE;$('#storyDialog').showModal()}$('#closeStory').onclick=()=>$('#storyDialog').close();
const GLOSSARY=[['Argumento','Conjunto de razones que intenta sostener una conclusión.'],['Autonomía','Capacidad de examinar razones y orientar decisiones sin limitarse a la presión externa.'],['Contraejemplo','Caso que pone en dificultad una afirmación general o una definición.'],['Deliberación','Examen de alternativas y razones antes de decidir.'],['Epistemología','Reflexión filosófica sobre el conocimiento y su justificación.'],['Equidad','Consideración de condiciones relevantes para remover barreras y favorecer un trato justo.'],['Estereotipo','Atribución general de rasgos a personas por su pertenencia a un grupo.'],['Ética','Examen crítico de las acciones, los valores y la vida buena.'],['Evidencia','Información pertinente que aporta respaldo a una afirmación.'],['Falacia','Defecto de razonamiento que puede parecer convincente.'],['Identidad','Conjunto complejo y cambiante de rasgos, relaciones, recuerdos y proyectos con que nos reconocemos.'],['Ideología','Conjunto de ideas y valores que orienta una interpretación de la sociedad y la acción; el término tiene diversos usos.'],['Lógica','Estudio de relaciones de inferencia y criterios para evaluar razonamientos.'],['Ontología','Reflexión sobre el ser y sobre lo que existe.'],['Pluralismo','Reconocimiento de la convivencia de perspectivas y formas de vida diversas.'],['Praxis','Acción humana examinada en su relación con la reflexión; aquí, práctica consciente y revisable.'],['Premisa','Razón ofrecida como apoyo de una conclusión.'],['Sesgo de confirmación','Tendencia a favorecer información que coincide con nuestras creencias previas.'],['Validez deductiva','Relación en la que no pueden ser verdaderas todas las premisas y falsa la conclusión.'],['Virtud','Disposición o hábito valioso para actuar, que requiere práctica y juicio.']];
function guide(){$('#app').innerHTML=`<div class="wrap"><p class="tag">Cómo recorrer este curso</p><h1 id="mainStart" tabindex="-1">Preguntar, dialogar,<br>practicar y revisar.</h1><p class="intro">Propuesta de trabajo para grado octavo. Los tiempos, productos y criterios pueden ajustarse con el docente al calendario de la asignatura.</p><h2>Ruta sugerida de 32 horas</h2><div class="scroll-table"><table class="rubric"><thead><tr><th>Módulo</th><th>Tiempo orientativo</th><th>Producto</th></tr></thead><tbody>${MODULES.map(m=>`<tr><td>${m.id}. ${m.title}</td><td>${m.hours}</td><td>${m.practice.title}</td></tr>`).join('')}</tbody></table></div><p>Distribuye cada módulo entre lectura, exploración del laboratorio, diálogo sobre el caso, producción escrita y revisión. El módulo 6 requiere más tiempo para planear y, si se acuerda, aplicar el proyecto. Puedes trabajar con cuaderno cuando no tengas un dispositivo disponible.</p><h2>Una sesión posible de 50 minutos</h2><ol><li>5 minutos: una pregunta inicial y una respuesta provisional.</li><li>15 minutos: lectura de una lección y análisis de un ejemplo.</li><li>10 minutos: laboratorio o contraste de posturas.</li><li>15 minutos: trabajo en el producto del módulo.</li><li>5 minutos: registrar qué cambió y qué sigue abierto.</li></ol><p class="hint">Una sesión no completa por sí sola todo el módulo. Repite la secuencia con otras lecciones y reserva tiempo para la práctica.</p><h2>Acuerdos de diálogo</h2><ul><li>Criticamos ideas y acciones sin humillar a las personas.</li><li>Distinguimos lo que sabemos, lo que suponemos y lo que necesitamos averiguar.</li><li>Pedimos razones, ejemplos y aclaraciones; no exigimos revelar experiencias privadas.</li><li>Escuchamos una objeción antes de responder y podemos revisar nuestra postura.</li><li>No inventamos fuentes, resultados ni experiencias. Reconocemos las ayudas utilizadas.</li></ul><h2>Rúbrica orientativa de los productos</h2><p>La rúbrica sirve para autoevaluación y conversación con el docente. No asigna una nota oficial ni premia coincidir con una postura determinada.</p><div class="scroll-table"><table class="rubric"><thead><tr><th>Criterio</th><th>Por construir</th><th>En desarrollo</th><th>Logrado</th><th>Profundizado</th></tr></thead><tbody><tr><td>Pregunta y conceptos</td><td>El problema no se distingue.</td><td>Se identifica, pero usa términos ambiguos.</td><td>Pregunta clara y conceptos bien aplicados.</td><td>Aclara límites y contrasta interpretaciones.</td></tr><tr><td>Razones y evidencia</td><td>Afirma sin justificar.</td><td>Ofrece razones poco conectadas.</td><td>Conecta razones pertinentes con la conclusión.</td><td>Examina fuentes, incertidumbre y fuerza del apoyo.</td></tr><tr><td>Perspectivas y objeciones</td><td>No considera otras miradas.</td><td>Las menciona sin examinarlas.</td><td>Presenta una objeción seria y responde.</td><td>La objeción mejora la propuesta o su alcance.</td></tr><tr><td>Aplicación y revisión</td><td>No relaciona ideas con el caso.</td><td>Propone una acción poco clara.</td><td>Acción coherente y revisión explícita.</td><td>Evalúa límites y propone un ajuste fundamentado.</td></tr></tbody></table></div><h2>Acceso, guardado y uso en móviles</h2><p>En iPhone utiliza el enlace web desde Safari. Un archivo HTML descargado puede abrirse en un visor que no ejecuta las actividades. El curso no necesita servicios externos para mostrar la teoría y los laboratorios; las lecturas enlazadas sí requieren Internet. La lectura en voz alta depende del navegador y de sus voces.</p><p>El progreso se guarda en este navegador cuando permite almacenamiento. No hay cuentas de estudiante, sincronización entre dispositivos ni envío automático al docente. Descarga el portafolio para entregarlo y el respaldo JSON para trasladar tu avance. Borrar los datos del navegador puede eliminar lo guardado.</p><h2>Glosario para volver a las ideas</h2><label for="glossSearch">Buscar un concepto</label><input type="search" id="glossSearch" placeholder="Ejemplo: argumento"><dl id="glossary" class="glossary"></dl><h2>Fuentes y alcance del curso</h2><p>La secuencia parte del PDF aportado: <em>Filosofía: El papel de la filosofía</em>, grado 8.º, Lic. Henry Horacio Ruiz Ortiz. Se desarrollaron explicaciones y actividades originales para esta experiencia. La historieta, sus diálogos y todos los casos escolares son recreaciones didácticas.</p><p>Las lecturas de ampliación se enlazan en su fuente original. No se presentan como materiales producidos por el curso. La historia de la filosofía aquí es selectiva; no cubre todas las tradiciones. Los ejercicios de ética invitan a justificar decisiones y no sustituyen el acompañamiento docente.</p><div class="actions"><button class="primary" data-route="mapa">Volver a los módulos →</button></div></div>`;function draw(){const term=$('#glossSearch').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const found=GLOSSARY.filter(x=>x.join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(term));$('#glossary').innerHTML=found.length?found.map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join(''):'<p>No hay coincidencias. Prueba con otra palabra.</p>'}$('#glossSearch').oninput=draw;draw()}
function legacy(){let home='',story={};try{home=localStorage.getItem('filosofia-inicio-reflexion')||'';story=JSON.parse(localStorage.getItem('cronicas-v1'))||{}}catch(e){}return {home,story}}function portfolioBody(){const leg=legacy();return `<h1>Mi portafolio filosófico</h1><p>Filosofía para la vida · Grado octavo · ${new Date().toLocaleDateString('es-CO')}</p><p>Avance de trabajo registrado: ${allProgress()}%. Este indicador no equivale a una calificación.</p>${leg.home?`<h2>Reflexión de la página de inicio</h2><p>${esc(leg.home).replace(/\n/g,'<br>')}</p>`:''}${leg.story.note?`<h2>Bitácora de Crónicas del asombro</h2><p>${esc(leg.story.note).replace(/\n/g,'<br>')}</p>`:''}${MODULES.map(m=>`<article class="print-module"><h2>Módulo ${m.id} · ${m.title}</h2><p>${progress(m).read}/6 lecciones marcadas. Autoevaluación: ${state.quizResults[m.id]?.completed?state.quizResults[m.id].score+'/4 en el último intento':'pendiente'}.</p>${[[m.id+'-lab','Conclusión del laboratorio'],[m.id+'-case','Análisis del caso'],...m.practice.prompts.map((p,i)=>[m.id+'-'+i,p]),[m.id+'-resource','Lectura de ampliación']].map(([key,label])=>`<h3>${esc(label)}</h3><p>${esc(state.notes[key]||'(Sin respuesta registrada)').replace(/\n/g,'<br>')}</p>`).join('')}<h3>Revisión propia</h3><ul>${m.practice.criteria.map((c,i)=>`<li>${state.checks[m.id+'-'+i]?'✓':'○'} ${c}</li>`).join('')}</ul></article>`).join('')}`}
function portfolioText(){const leg=legacy();let text=`FILOSOFÍA PARA LA VIDA · GRADO OCTAVO\nPORTAFOLIO PERSONAL\n${new Date().toLocaleString('es-CO')}\nAvance de trabajo: ${allProgress()}% (no equivale a nota)\n`;if(leg.home)text+='\nREFLEXIÓN INICIAL\n'+leg.home+'\n';if(leg.story.note)text+='\nBITÁCORA DE LA HISTORIETA\n'+leg.story.note+'\n';for(const m of MODULES){text+=`\nMÓDULO ${m.id} · ${m.title}\nLecciones marcadas: ${progress(m).read}/6\nAutoevaluación: ${state.quizResults[m.id]?.completed?state.quizResults[m.id].score+'/4':'pendiente'}\n`;for(const [key,label]of [[m.id+'-lab','Laboratorio'],[m.id+'-case','Caso'],...m.practice.prompts.map((p,i)=>[m.id+'-'+i,p]),[m.id+'-resource','Ampliación']])text+='\n'+label+'\n'+(state.notes[key]||'(Sin respuesta registrada)')+'\n';text+='\nRevisión propia:\n'+m.practice.criteria.map((c,i)=>(state.checks[m.id+'-'+i]?'[x] ':'[ ] ')+c).join('\n')+'\n'}return text}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function portfolio(){$('#app').innerHTML=`<div class="wrap portfolio"><p class="tag">Tu trabajo, en tus palabras</p><h1 id="mainStart" tabindex="-1">Mi portafolio.</h1><p class="intro">Reúne tus prácticas y vuelve sobre las ideas que cambiaron. Descarga el texto para compartirlo con tu docente por el medio que te indique.</p><div class="actions"><button class="primary" id="exportText">Descargar portafolio .txt</button><button id="printPortfolio">Imprimir / guardar como PDF</button><button id="exportBackup">Respaldar avance .json</button><button id="importBackup">Importar respaldo</button></div><p class="hint">El portafolio contiene respuestas y revisión propia; el respaldo JSON permite continuar en otro navegador. Importar actualiza los campos presentes en el respaldo: descarga primero el avance actual si deseas conservarlo.</p><div class="note-box"><b>Estado de guardado:</b> ${persistOK?'almacenamiento local disponible en esta sesión.':'solo memoria temporal; descarga tu trabajo antes de cerrar.'} No hay envío automático, cuenta estudiantil ni sincronización en la nube.</div><div id="importMessage" aria-live="polite"></div>${MODULES.map(m=>{const p=progress(m);return `<article><div class="tag">Módulo 0${m.id}</div><h2>${m.title}</h2><p class="hint">${p.read}/6 lecturas · ${p.notes}/${m.practice.prompts.length} campos · Autoevaluación: ${state.quizResults[m.id]?.completed?state.quizResults[m.id].score+'/4':'pendiente'}</p><div class="track"><span style="width:${p.percent}%"></span></div><button data-route="modulo/${m.id}/practicar">Abrir o completar mi práctica</button><details><summary>Ver respuestas guardadas</summary>${[[m.id+'-lab','Laboratorio'],[m.id+'-case','Caso'],...m.practice.prompts.map((p,i)=>[m.id+'-'+i,p]),[m.id+'-resource','Ampliación']].map(([key,label])=>`<h3>${esc(label)}</h3><pre>${esc(state.notes[key]||'Sin respuesta registrada.')}</pre>`).join('')}</details></article>`}).join('')}<details><summary>Reflexiones de la portada y la historieta</summary><p>Se incluyen en la descarga cuando se han guardado desde este mismo navegador.</p><pre>${esc(legacy().home||'Sin reflexión de portada.')}</pre><pre>${esc(legacy().story.note||'Sin nota de la historieta.')}</pre></details></div>`;$('#exportText').onclick=()=>download('Mi_portafolio_filosofico.txt',portfolioText(),'text/plain;charset=utf-8');$('#printPortfolio').onclick=()=>{$('#printArea').innerHTML=portfolioBody();window.print()};$('#exportBackup').onclick=()=>download('Respaldo_filosofia_octavo.json',JSON.stringify({course:'filosofia-vida-octavo',version:1,state,legacy:legacy(),exportedAt:new Date().toISOString()},null,2),'application/json');$('#importBackup').onclick=()=>$('#importFile').click()}
function normalizeBackup(raw){if(!raw||raw.course!=='filosofia-vida-octavo'||raw.version!==1||!raw.state||typeof raw.state!=='object')throw Error('El archivo no es un respaldo compatible de este curso.');const src=raw.state,clean={read:{},notes:{},checks:{},quiz:{},quizResults:{},lab:{}};for(const m of MODULES){for(let i=0;i<6;i++){const k=m.id+'-'+i;if(typeof src.read?.[k]==='boolean')clean.read[k]=src.read[k]}for(const key of [...m.practice.prompts.map((_,i)=>m.id+'-'+i),m.id+'-case',m.id+'-lab',m.id+'-resource']){const val=src.notes?.[key];if(typeof val==='string')clean.notes[key]=val.slice(0,60000)}for(let i=0;i<m.practice.criteria.length;i++){const k=m.id+'-'+i;if(typeof src.checks?.[k]==='boolean')clean.checks[k]=src.checks[k]}for(let i=0;i<m.quiz.length;i++){const k=m.id+'-'+i,v=src.quiz?.[k];if(Number.isInteger(v)&&v>=0&&v<m.quiz[i].opts.length)clean.quiz[k]=v}if(src.quizResults?.[m.id]?.completed&&m.quiz.every((_,i)=>Number.isInteger(clean.quiz[m.id+'-'+i])))clean.quizResults[m.id]={completed:true,score:m.quiz.reduce((s,q,i)=>s+(q.answer===clean.quiz[m.id+'-'+i]?1:0),0),date:new Date().toISOString()}}if(Array.isArray(src.lab?.order)&&src.lab.order.length===5&&new Set(src.lab.order).size===5&&src.lab.order.every(x=>Number.isInteger(x)&&x>=0&&x<=4))clean.lab.order=src.lab.order;return clean}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('El respaldo supera el límite de 5 MB.');const raw=JSON.parse(await file.text());const clean=normalizeBackup(raw);if(!confirm('Se actualizarán los campos incluidos en este respaldo. ¿Continuar?'))return;for(const k of ['read','notes','checks','quiz','lab'])state[k]={...state[k],...clean[k]};for(const m of MODULES){if(m.quiz.some((_,i)=>Object.hasOwn(clean.quiz,m.id+'-'+i)))delete state.quizResults[m.id]}state.quizResults={...state.quizResults,...clean.quizResults};if(raw.legacy&&typeof raw.legacy==='object'){try{if(typeof raw.legacy.home==='string')localStorage.setItem('filosofia-inicio-reflexion',raw.legacy.home.slice(0,60000));if(raw.legacy.story&&typeof raw.legacy.story.note==='string'){const prev=legacy().story;prev.note=raw.legacy.story.note.slice(0,60000);if(raw.legacy.story.answers&&typeof raw.legacy.story.answers==='object'){prev.answers={};for(let i=1;i<=6;i++){const v=raw.legacy.story.answers[i];if(Number.isInteger(v)&&v>=0&&v<([0,2,2,4,2,2,3][i]))prev.answers[i]=v}}localStorage.setItem('cronicas-v1',JSON.stringify(prev))}}catch(err){persistOK=false}}save();portfolio();$('#importMessage').textContent='Respaldo importado. Revisa tus respuestas y continúa en el módulo que prefieras.'}catch(err){const box=$('#importMessage');if(box)box.textContent='No se importó: '+err.message;else $('#status').textContent='No se pudo importar el respaldo.'}finally{e.target.value=''}};
render();
</script></body></html>
