croll-table{overflow-x:auto}.glossary dt{font:21px Georgia;color:var(--gold);margin-top:15px}.glossary dd{font-size:14px;margin:8px 0 20px}.diagram{width:100%;height:auto;max-height:310px}.mode-steps{display:flex;gap:8px;flex-wrap:wrap}.concepts{display:flex;gap:10px;flex-wrap:wrap}.concepts button{min-width:140px}.lab .output{border:1px dashed #927747;padding:17px;margin-top:20px}.lab input[type=range]{width:100%;accent-color:#254437}#printArea{display:none}@media(min-width:1400px){.course-grid{gap:65px}}@media(max-width:900px){.course-grid{grid-template-columns:1fr;padding:25px}.side{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:15px}.side .side-links{display:flex;gap:6px;overflow-x:auto}.side button{width:auto;min-width:115px;max-width:170px;flex-shrink:0;font-size:11px}.side .side-extra{display:none}.cards{grid-template-columns:1fr 1fr}.topnav{flex-wrap:wrap;justify-content:flex-end}.top{padding:10px 20px}.brand{font-size:16px}.topnav button{font-size:11px;padding:8px}.wrap{padding:35px 25px}.seal{width:110px;height:110px;font-size:65px}}@media(max-width:560px){:root{--body:16px}.top{gap:10px;align-items:start;min-height:100px;flex-direction:column}.topnav{width:100%;justify-content:flex-start;gap:5px}.topnav button{padding:7px 9px}.brand small{display:inline;margin-left:7px;font-size:8px}.homeframe{height:calc(100svh - 110px)}.cards,.toc,.glossary{grid-template-columns:1fr}.route-head{display:block}.seal{display:none}.intro{font-size:18px}.lab{padding:20px}.tabs button{padding:9px;font-size:12px}.lesson h2{font-size:26px}.course-grid{padding:20px}.content h1{font-size:35px}.rubric{min-width:600px}.question{padding:16px}.question legend{font-size:18px}.dialogbar span{font-size:11px}.sticky-status{font-size:10px}.brand{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{body{background:white!important;color:#111!important;font:11pt/1.5 Arial}.top,#app,. </style></head><body><a class="skip" href="#app">Saltar al contenido</a><header class="top"><button class="brand" data-route="inicio">Filosofía <em>para la vida</em><small>GRADO OCTAVO · CURSO COMPLETO</small></button><nav class="topnav" aria-label="Curso"><button data-route="mapa">Seis módulos</button><button data-route="portafolio">Mi portafolio</button><button data-route="guia">Guía y glosario</button><button id="fontButton" aria-label="Aumentar tamaño de texto">A+</button></nav></header><main id="app" tabindex="-1"><div class="wrap"><h1>Filosofía para la vida</h1><p>Cargando el curso…</p><noscript>Activa JavaScript en tu navegador para acceder a los módulos y las actividades.</noscript></div></main><div id="status" class="sticky-status" role="status">Progreso local · sin envío al docente</div><dialog id="storyDialog"><div class="dialogbar"><span>Crónicas del asombro · 8 escenas</span><button id="closeStory">Cerrar ✕</button></div><iframe id="storyFrame" title="Historieta Crónicas del asombro"></iframe></dialog><input id="importFile" type="file" accept="application/json,.json" hidden><div id="printArea"></div><script>
const MODULES=[{"id": 1, "title": "El arte de preguntar", "subtitle": "Aprender a filosofar en la vida cotidiana", "icon": "✦", "hours": "4 horas sugeridas", "intro": "Lo cotidiano puede convertirse en una aventura intelectual. En este módulo aprenderás a pasar de una impresión rápida a una pregunta que merece ser investigada.", "objectives": ["Distinguir una pregunta de datos de una pregunta filosófica.", "Explicar qué hacen la ética, la lógica y la teoría del conocimiento.", "Construir una pregunta clara y revisable sobre tu entorno."], "lessons": [{"title": "1.1 · La filosofía comienza con el asombro", "paragraphs": ["Imagina que recorres todos los días el mismo camino al colegio. Un día te detienes y preguntas por qué algunas personas tienen más oportunidades que otras. La calle no cambió; cambió tu manera de mirarla. Ese paso de lo familiar a lo problemático expresa el asombro filosófico. Asombrarse no significa ignorarlo todo: significa reconocer que algo conocido todavía necesita una explicación.", "La palabra filosofía suele traducirse como amor por la sabiduría. Aquí la entenderemos como una actividad de reflexión que examina preguntas fundamentales mediante conceptos, razones y diálogo. No es una colección de frases bonitas ni una competencia para parecer inteligente. Una pregunta importa cuando ayuda a comprender algo y cuando estamos dispuestos a revisar nuestra respuesta.", "Puedes filosofar al preguntar si una norma es justa, qué hace verdadera una noticia o qué significa tener una buena amistad. Sin embargo, preguntar cualquier cosa no basta: es necesario precisar el problema, escuchar posibles respuestas y analizar sus razones. La curiosidad inicia el camino; la argumentación lo vuelve más riguroso.", "Durante este curso no se espera que adoptes una única visión de la vida. Se espera que aprendas a explicar tus ideas, considerar objeciones y actuar con mayor atención. Dudar de una creencia no equivale a burlarse de quien la sostiene. La duda puede ser una forma de cuidado: evita que actuemos de manera automática."]}, {"title": "1.2 · Preguntas de datos y preguntas filosóficas", "paragraphs": ["Una pregunta de datos pide información que podemos obtener con un procedimiento relativamente definido: cuántos estudiantes hay en el salón o a qué hora comienza la clase. Una pregunta filosófica suele examinar el significado, la justificación o el valor de algo: qué hace justa una norma o cuándo una decisión puede llamarse libre.", "Ambas clases de preguntas pueden colaborar. Si preguntamos si la biblioteca debe abrir más tiempo, necesitamos saber sus horarios, los recursos disponibles y cuántas personas la usan. También necesitamos discutir un criterio: cómo distribuir equitativamente el acceso. Los datos no reemplazan los valores, y los valores no permiten inventar datos.", "Una pregunta filosófica no es simplemente una pregunta imposible. Puede recibir respuestas más o menos razonables. “¿Qué es la amistad?” es demasiado amplia para comenzar; “¿Puede una amistad exigir que ocultemos una acción que perjudica a otra persona?” presenta un conflicto más concreto. Delimitar no elimina la profundidad: la hace trabajable.", "Prueba esta transformación: “¿Cuántos seguidores tiene una persona?” se convierte en “¿Tener muchos seguidores hace confiable lo que afirma?”. El cambio desplaza la atención de una cantidad hacia una relación que debe justificarse. Cuando una pregunta mezcla varios asuntos, sepárala: verdad, popularidad y confianza no significan lo mismo."]}, {"title": "1.3 · El mapa de los problemas filosóficos", "paragraphs": ["La ética pregunta por nuestras acciones, los valores y la vida buena. La epistemología examina el conocimiento y su justificación. La lógica estudia relaciones entre afirmaciones y permite evaluar razonamientos. La ontología pregunta por lo que existe y por el significado de ser. La filosofía política reflexiona sobre el poder, la justicia y la organización de la vida común.", "La estética no se limita a decidir si una imagen es bonita: examina el arte, la experiencia estética y los criterios con que interpretamos obras. La antropología filosófica aborda preguntas sobre la condición humana, la identidad, la libertad o la relación con otras personas. Estas áreas se cruzan constantemente. Una imagen creada con inteligencia artificial puede despertar preguntas sobre autoría, verdad, belleza y responsabilidad al mismo tiempo.", "Las ciencias investigan el mundo mediante sus propios métodos, y la filosofía dialoga con ellas. La psicología y la sociología actuales son disciplinas autónomas; no conviene presentarlas simplemente como ramas de la filosofía. Podemos estudiar experimentalmente cómo se forman los recuerdos y, además, preguntar qué papel tiene la memoria en nuestra identidad.", "El mapa es una herramienta, no una frontera cerrada. Si tu problema parece pertenecer a varias áreas, explica por qué. Reconocer los diferentes aspectos evita responder una pregunta ética solo con una cifra o una pregunta empírica solo con una preferencia."]}, {"title": "1.4 · Opinión, razón, objeción y revisión", "paragraphs": ["Una opinión es una postura. Una razón intenta mostrar por qué esa postura merece aceptación. “El recreo debería durar más” expresa una opinión. “Debería durar más porque la fila del comedor ocupa casi todo el descanso” añade una razón que podemos examinar. Podríamos observar la fila varios días y comprobar si ocurre lo descrito.", "Una objeción señala una dificultad real: ampliar el recreo podría reducir otra actividad importante. No necesariamente destruye la propuesta; obliga a mejorarla. Tal vez la solución sea reorganizar la fila o aumentar los puntos de atención. Pensar bien incluye comparar alternativas, no solo defender la primera idea.", "Revisar una opinión no significa que antes fuéramos incapaces. Puede mostrar aprendizaje. Una buena revisión explica qué cambió: apareció una evidencia, se aclaró una palabra o se reconoció a una persona que no había sido escuchada. Cambiar por una razón es distinto de cambiar únicamente por miedo al grupo.", "Utiliza esta estructura inicial: sostengo que…, porque…, un ejemplo es…, alguien podría objetar que…, ante eso propongo…. No es una fórmula que vuelva correcto cualquier argumento. Sirve para hacer visible el razonamiento y encontrar dónde necesita apoyo."]}, {"title": "1.5 · Un método para conversar sin imponer", "paragraphs": ["Una conversación filosófica necesita una pregunta compartida. Si una persona habla de castigos y otra de causas de un problema, quizá discutan sin responder al mismo asunto. Antes de comenzar, escriban la pregunta y aclaren dos palabras centrales. Después, cada participante ofrece una respuesta provisional acompañada de razones.", "Escuchar activamente consiste en intentar comprender la mejor versión de la idea ajena. Puedes decir: “Si te entiendo, propones esto por esta razón”. La otra persona puede corregirte. Este pequeño paso evita muchas discusiones basadas en interpretaciones equivocadas. Preguntar por un ejemplo también ayuda a pasar de expresiones vagas a situaciones examinables.", "No todos los desacuerdos terminan en consenso. Es posible identificar qué se comparte y qué continúa abierto. Un cierre responsable registra una conclusión provisional y una pregunta pendiente. El respeto se dirige a las personas; las ideas pueden recibir críticas firmes. No es necesario aceptar una afirmación para reconocer el derecho de alguien a ser escuchado.", "En clase podemos alternar los papeles de quien pregunta, quien argumenta, quien ofrece un contraejemplo y quien resume. Así el diálogo deja de ser una competencia por hablar más. La calidad se aprecia por la claridad de las razones, la atención a las objeciones y la posibilidad de aprender."]}, {"title": "1.6 · De lo cotidiano a un problema investigable", "paragraphs": ["Piensa en la frase “ese estudiante nunca participa”. Antes de convertirla en un juicio definitivo, distingue observación e interpretación. Tal vez observaste que no habló durante una actividad. Decir que nunca participa generaliza más allá de lo visto. Decir que no le interesa aprender atribuye una intención que todavía no conoces.", "Un problema filosófico puede surgir al preguntar qué cuenta como participar: ¿solo hablar en voz alta o también escuchar, escribir y ayudar? Para investigarlo, reúne ejemplos distintos. Busca un caso que contradiga tu primera definición. Si una persona redacta las ideas del equipo en silencio, ¿participó? El contraejemplo ayuda a mejorar el concepto.", "La reflexión tiene varios movimientos: describir, preguntar, ofrecer razones y evaluar consecuencias. En este curso los usamos como una ruta didáctica; no son una lista universal y obligatoria de niveles de pensamiento. Puedes volver a un movimiento anterior si descubres una dificultad.", "El producto del módulo será una ficha de pregunta. Debe incluir una situación sin nombres reales, una pregunta delimitada, dos respuestas posibles y una razón a favor de cada una. Termina explicando qué necesitas averiguar. Reconocer una información faltante es mejor que fingir seguridad."]}], "case": {"title": "El silencio de Valeria", "text": "En un equipo, Valeria casi no habla, pero organiza las notas y encuentra un error en la propuesta. Dos compañeros dicen que no merece aparecer como integrante porque “participar es hablar”. ¿Qué definición de participación están usando?", "steps": ["Describe dos hechos del caso sin atribuir intenciones.", "Propón una definición inicial de participación.", "Usa el trabajo de Valeria como posible contraejemplo.", "Revisa tu definición e indica cómo reconocerías diferentes aportes."], "model": "Una respuesta razonada distingue hablar de contribuir. Puede proponer que participar sea aportar al objetivo compartido, por medios orales, escritos u organizativos. También necesita acordar tareas visibles para no confundir silencio con ausencia de trabajo."}, "practice": {"title": "Diario del asombro", "steps": ["Durante tres días observa una situación cotidiana que te produzca curiosidad. No registres nombres ni datos personales.", "Escribe qué viste y, por separado, qué interpretaste.", "Transforma una pregunta de datos en una pregunta sobre razones, significados o valores.", "Elige una pregunta y escribe dos respuestas posibles con un ejemplo para cada una.", "Conversa con una persona de confianza o simula una objeción razonable. Revisa tu primera respuesta."], "prompts": ["Situación y observaciones: ¿qué ocurrió realmente?", "Mi pregunta filosófica y las dos palabras que debo aclarar.", "Dos respuestas posibles, sus razones y un ejemplo.", "La objeción que consideré y lo que cambié."], "criteria": ["La situación está descrita sin generalizaciones injustificadas.", "La pregunta es clara y no se limita a pedir un dato.", "Las dos respuestas incluyen razones.", "La revisión explica qué se aprendió."]}, "quiz": [{"q": "¿Cuál es una pregunta principalmente filosófica?", "opts": ["¿Cuántas reglas tiene el manual?", "¿Qué hace justa una regla?", "¿En qué página aparece la regla?"], "answer": 1, "why": "La segunda pregunta examina un criterio de justicia; las otras buscan información localizada."}, {"q": "¿Qué diferencia una razón de una simple opinión?", "opts": ["Una razón intenta justificar la postura.", "Una razón siempre es más larga.", "Una razón nunca puede discutirse."], "answer": 0, "why": "Justificar permite que otras personas examinen el apoyo de una idea."}, {"q": "¿Qué conviene hacer ante un contraejemplo válido?", "opts": ["Ignorarlo para no perder.", "Repetir la definición.", "Revisar si la definición necesita cambiar."], "answer": 2, "why": "Un contraejemplo revela un límite que puede mejorar la definición."}, {"q": "¿Qué área pregunta cómo justificamos lo que sabemos?", "opts": ["Estética.", "Epistemología.", "Filosofía política."], "answer": 1, "why": "La epistemología investiga el conocimiento y su justificación."}], "resources": [{"title": "UNESCO · Día Mundial de la Filosofía", "url": "https://www.unesco.org/es/days/philosophy", "guide": "Lee la presentación y explica con un ejemplo propio cómo una pregunta puede favorecer el diálogo.", "level": "Lectura accesible"}, {"title": "UNESCO · La filosofía, una escuela de la libertad", "url": "https://unesdoc.unesco.org/ark:/48223/pf0000192689", "guide": "Consulta el índice y el apartado sobre filosofía con niños. Selecciona una idea para conversar con tu docente; no necesitas leer el libro completo.", "level": "Ampliación con acompañamiento"}]}, {"id": 2, "title": "Crónicas del asombro", "subtitle": "Un viaje por las preguntas y la historia", "icon": "◎", "hours": "5 horas sugeridas", "intro": "La aventura de Lía es el punto de partida para explorar el asombro, el diálogo socrático, la apariencia y la relación entre pensamiento y acción. La ficción ayuda a preguntar; no reemplaza las fuentes históricas.", "objectives": ["Relacionar escenas de la historieta con problemas filosóficos.", "Practicar preguntas socráticas y construir un contraejemplo.", "Distinguir una adaptación narrativa de un testimonio histórico."], "lessons": [{"title": "2.1 · Cómo viajar sin confundir historia y ficción", "paragraphs": ["La historieta presenta a Lía, una estudiante que encuentra una brújula que se activa con preguntas. Los viajes y los diálogos fueron creados para este curso. Cuando aparece Sócrates, sus palabras son una recreación didáctica: no una cita conservada de una conversación real. Esta diferencia importa porque comprender una idea y demostrar qué dijo una persona son tareas distintas.", "La historia de la filosofía no es una carrera en la que una época derrota por completo a la anterior. Algunas preguntas cambian con las sociedades y otras reaparecen bajo nuevas formas. La búsqueda de una explicación de la naturaleza no es idéntica al examen de una noticia en redes, pero ambas pueden exigir razones y cuidado con lo que se afirma.", "Nuestra ruta se concentra en algunos problemas de la tradición griega y en conexiones con la vida actual. No representa toda la historia del pensamiento. Existen tradiciones filosóficas en múltiples regiones y culturas. Reconocer ese alcance evita confundir una selección de ejemplos con un relato universal y completo.", "Antes de abrir la aventura, escribe qué esperas aprender. Durante el recorrido identifica una pregunta por escena. Después elige dos decisiones de Lía y explica qué razones darías tú. La actividad no consiste en recordar fechas sueltas, sino en relacionar preguntas con formas de pensar."]}, {"title": "2.2 · Naturaleza, explicación y asombro", "paragraphs": ["La parada en Jonia invita a mirar la naturaleza como un problema. En la tradición griega antigua, algunos pensadores buscaron principios que permitieran comprender el cambio y la diversidad del mundo. Esta búsqueda es relevante porque intenta ofrecer explicaciones que pueden discutirse, en lugar de cerrar la conversación con una afirmación incuestionable.", "A veces se describe este proceso como un paso del mito al logos. Es una simplificación útil si se maneja con cuidado: las narraciones míticas y los razonamientos no desaparecieron o surgieron de golpe, y convivieron de formas complejas. Además, una narración puede comunicar sentidos culturales sin funcionar como una explicación científica.", "No debemos atribuir a los primeros filósofos todos los métodos de la ciencia actual. Lo que nos interesa aquí es el gesto de buscar una razón y someterla a examen. Una explicación puede ser ingeniosa y, aun así, necesitar evidencia. Preguntar por qué llueve no se resuelve solo con una palabra solemne.", "En la escena del mar, Lía aprende a transformar su sorpresa en investigación. Haz lo mismo con un fenómeno cercano: una planta que crece hacia la ventana o un objeto que flota. Separa la explicación empírica del fenómeno de una pregunta filosófica sobre qué cuenta como una buena explicación. Ambas preguntas pueden ayudarse sin confundirse."]}, {"title": "2.3 · Sócrates: poner a prueba una definición", "paragraphs": ["Sócrates es conocido, entre otras fuentes, por los diálogos de Platón. En nuestra adaptación, su función es mostrar una práctica: pedir que se aclare un concepto y examinar si la definición funciona en casos diferentes. Si alguien afirma que ser valiente es no sentir miedo, podemos preguntar si una persona que tiene miedo y aun así ayuda responsablemente deja de ser valiente.", "Un ejemplo ilustra una idea; un contraejemplo muestra que una afirmación general no funciona en todos los casos que pretende abarcar. No basta responder “yo pienso distinto”. El contraejemplo debe tocar exactamente la definición. Si definimos amistad como estar siempre de acuerdo, una amistad que permite disentir sin romperse pone esa definición en dificultad.", "La conversación socrática no debería convertirse en una trampa para avergonzar. Su valor educativo aparece cuando todos aceptan revisar lo que dicen, incluida la persona que pregunta. Preguntas útiles son: ¿qué significa esa palabra?, ¿podrías dar un caso?, ¿siempre ocurre así?, ¿qué pasaría si cambiamos esta condición?", "En el ágora imaginada, Lía pregunta si la mayoría decide lo justo. La cuestión sigue abierta a discusión: votar puede servir para tomar una decisión, pero no demuestra por sí mismo que esa decisión respete a todas las personas. El procedimiento y la justificación deben examinarse por separado."]}, {"title": "2.4 · La caverna: aprender a revisar apariencias", "paragraphs": ["Platón presenta en el libro VII de la República una alegoría en la que personas encerradas toman sombras por la realidad. La salida de la caverna permite pensar el aprendizaje como una transformación de la mirada. Esta breve presentación es una paráfrasis: la lectura de ampliación ofrece el texto y su contexto.", "La imagen nos ayuda a formular una pregunta actual: ¿cuánto de lo que creemos conocer depende de una perspectiva limitada? Un video recortado puede mostrar una parte verdadera de un hecho y producir una interpretación equivocada. Para revisar esa interpretación necesitamos contexto, otras fuentes y disposición a cambiar.", "La comparación con las pantallas tiene límites. Internet no es, por definición, una caverna de falsedades, ni desconfiar de todo equivale a conocer. También encontramos información valiosa y comunidades de aprendizaje. La tarea consiste en examinar cómo sabemos, no en sustituir una confianza ciega por una sospecha absoluta.", "En el laboratorio de este módulo podrás pasar de una descripción incompleta a una escena con contexto. Observa qué inferiste antes de recibir la segunda parte. Después pregunta si tu primera conclusión era posible, probable o demostrada. Esas palabras expresan grados de respaldo diferentes y nos ayudan a no exagerar nuestra certeza."]}, {"title": "2.5 · De los conceptos a las decisiones de Lía", "paragraphs": ["El archivo de las preguntas organiza campos filosóficos, pero Lía no puede quedarse allí para siempre. Al volver al colegio encuentra un rumor. Ese episodio conecta tres dimensiones: una cuestión de conocimiento —qué evidencia hay—, una cuestión ética —a quién podría perjudicar— y una cuestión social —por qué el grupo lo difunde—.", "Una misma situación requiere más de una herramienta. Comprobar un dato no resuelve automáticamente cómo tratar a una persona; querer ayudar no vuelve verdadera una afirmación. La filosofía permite reconocer estas diferencias y coordinar preguntas. Primero aclara qué sabes, después qué ignoras y finalmente qué acción puedes justificar.", "La brújula representa una disposición, no un objeto mágico que proporcione respuestas correctas. Cuando Lía pregunta, abre posibilidades. Cuando argumenta, compara esas posibilidades. Cuando actúa y examina el resultado, aprende de su práctica. Así aparece la relación entre reflexión y acción que retomaremos en el último módulo.", "El recorrido tampoco obliga a condenar toda creencia compartida. Pertenecer a un grupo puede ofrecer apoyo y sentido. El problema surge cuando la pertenencia prohíbe preguntar o convierte el desacuerdo en motivo de exclusión. Podemos valorar nuestras comunidades y, a la vez, discutir sus ideas."]}, {"title": "2.6 · Leer una historia como filósofo", "paragraphs": ["Leer filosóficamente no es buscar una moraleja única al final. Es identificar tensiones que merecen una conversación. En cada escena distingue el problema, la decisión y la razón ofrecida. Después imagina una opción que no apareció. Esa alternativa revela que el relato selecciona posibilidades y que tú puedes ampliar la discusión.", "La primera lectura puede concentrarse en lo que ocurre. En una segunda lectura, detente en los conceptos: verdad, justicia, sabiduría o identidad. En una tercera, busca objeciones. ¿Qué pasaría si a Lía le faltara información? ¿Qué cambiaría si una decisión afectara de modo desigual a dos personas? Así un relato breve se convierte en una investigación.", "Una interpretación necesita apoyarse en elementos de la historia. No basta afirmar que un personaje es bueno o malo. Indica una decisión concreta, explica cómo la entiendes y considera otra lectura posible. También puedes reconocer que una escena deja algo indeterminado.", "El producto será una escena alternativa de seis viñetas, dibujada o descrita con palabras. Debe incluir una pregunta, dos respuestas rivales, una razón, una objeción, una decisión y un cierre provisional. No se evalúa la calidad artística del dibujo, sino la claridad del problema y la conexión entre pensamiento y acción."]}], "case": {"title": "¿Valiente o imprudente?", "text": "Tomás sostiene que ser valiente consiste en actuar sin pensar. Lina propone que una persona también puede ser valiente cuando reconoce el riesgo, pide apoyo y actúa con cuidado.", "steps": ["Define valentía con tus palabras.", "Construye un caso cotidiano que ponga a prueba la definición de Tomás, sin describir acciones peligrosas.", "Escribe una pregunta que Sócrates podría plantear en este diálogo imaginado.", "Reformula la definición para distinguir valentía e imprudencia."], "model": "Se puede usar el caso de quien reconoce que cometió un error frente al grupo, aunque teme perder aprobación. La valentía puede incluir juicio y cuidado; actuar sin pensar no garantiza una acción valiosa."}, "practice": {"title": "Una nueva escena para la brújula", "steps": ["Recorre las ocho escenas de la historieta y registra dos decisiones que te hicieron pensar.", "Selecciona un problema escolar ficticio y dos posturas posibles.", "Escribe o dibuja seis viñetas con una secuencia comprensible.", "Incluye una pregunta de aclaración y un contraejemplo que obligue a revisar una idea.", "Cierra con una decisión razonada y una pregunta que permanezca abierta."], "prompts": ["Dos escenas originales: problema, decisión y mi interpretación.", "Guion de mis viñetas 1 y 2: situación y pregunta.", "Guion de mis viñetas 3 y 4: respuestas, razones y objeción.", "Guion de mis viñetas 5 y 6: revisión, decisión y pregunta abierta."], "criteria": ["Relaciono la aventura con una pregunta filosófica.", "El diálogo incluye una objeción pertinente.", "Distingo ficción y afirmación histórica.", "La decisión se conecta con razones."]}, "quiz": [{"q": "Los diálogos de Lía con Sócrates son…", "opts": ["Una transcripción histórica.", "Una recreación didáctica.", "Una prueba de que existió la brújula."], "answer": 1, "why": "Los personajes y viajes de la aventura son ficticios; no deben citarse como palabras históricas."}, {"q": "¿Qué hace un contraejemplo?", "opts": ["Pone a prueba una afirmación general.", "Ataca a quien habla.", "Repite un ejemplo favorable."], "answer": 0, "why": "Un caso que la definición no logra explicar ayuda a revisarla."}, {"q": "¿Qué enseñanza razonable ofrece la comparación con la caverna?", "opts": ["Todo lo que vemos es falso.", "Solo quien piensa como yo conoce.", "Conviene revisar las apariencias con contexto y razones."], "answer": 2, "why": "La analogía invita al examen; no demuestra que toda percepción sea falsa."}, {"q": "El rumor escolar conecta…", "opts": ["Solo una cuestión de gustos.", "Conocimiento, ética y vida social.", "Únicamente una fecha histórica."], "answer": 1, "why": "Importan la evidencia, el posible daño y la dinámica del grupo."}], "resources": [{"title": "Biblioteca Cervantes · Antología de filosofía griega", "url": "https://www.cervantesvirtual.com/obra-visor/antologia-filosofica-la-filosofia-griega--0/html/ff161722-82b1-11df-acc7-002185ce6064_4.htm", "guide": "Busca “caverna”. Lee el pasaje de Platón con apoyo docente y compara la imagen con un ejemplo actual sin tratarlos como situaciones idénticas.", "level": "Texto clásico · lectura acompañada"}, {"title": "UNESCO · Filosofía y diálogo", "url": "https://www.unesco.org/es/days/philosophy", "guide": "Relaciona la importancia del diálogo con dos decisiones de Lía. Escribe una diferencia entre convencer e imponer.", "level": "Lectura accesible"}]}, {"id": 3, "title": "Conocer y argumentar", "subtitle": "Herramientas para pensar con claridad", "icon": "◈", "hours": "6 horas sugeridas", "intro": "Una afirmación puede sonar convincente y estar mal apoyada. Aprende a distinguir hechos, interpretaciones y opiniones, a reconocer premisas y a revisar información antes de compartirla.", "objectives": ["Identificar premisas y conclusiones en argumentos cotidianos.", "Distinguir validez deductiva, verdad y apoyo probable.", "Evaluar una afirmación digital sin confundir popularidad con evidencia."], "lessons": [{"title": "3.1 · Creer, saber y justificar", "paragraphs": ["Creer algo significa aceptarlo como verdadero. Saber exige más que sentir seguridad. Si adivinas correctamente cuántas monedas hay en una caja, acertaste, pero no necesariamente tenías una buena justificación. Este ejemplo muestra por qué la teoría del conocimiento pregunta por la relación entre creencia, verdad y razones.", "Para comenzar, podemos pensar que el conocimiento necesita una creencia verdadera y justificada. Esta fórmula introductoria tiene dificultades que los filósofos han discutido; no es una definición final que resuelva todos los casos. Su utilidad aquí consiste en separar tres preguntas: ¿lo acepto?, ¿ocurre realmente?, ¿qué respaldo tengo?", "Las fuentes de conocimiento incluyen la percepción, la memoria, el razonamiento y el testimonio de otras personas. Todas pueden aportar información y también presentar límites. La memoria puede omitir detalles; una observación puede hacerse desde una posición parcial; un testigo puede confundirse. Reconocer límites no implica desechar todas las fuentes, sino compararlas de manera razonable.", "Una actitud responsable ajusta la confianza al respaldo disponible. Podemos decir “lo comprobé”, “es probable”, “todavía no lo sé” o “es una hipótesis”. Expresar incertidumbre con precisión ayuda más que exagerar seguridad. En la vida escolar, admitir que falta una fuente puede evitar una acusación injusta."]}, {"title": "3.2 · Hechos, opiniones e interpretaciones", "paragraphs": ["Una afirmación factual pretende describir algo que puede contrastarse: “la biblioteca cerró a las tres”. Puede ser verdadera o falsa; el hecho de que sea verificable no garantiza su verdad. Una opinión valorativa expresa una evaluación, como “ese horario es injusto”. Necesita razones, aunque no se compruebe del mismo modo que una hora en un registro.", "Una interpretación propone un sentido o una explicación: “cerró temprano porque no consideran importante la lectura”. Tal interpretación podría ser correcta, pero el horario por sí solo no demuestra la intención atribuida. Tal vez hubo una reparación. Cuando mezclamos dato e interpretación, damos por probado lo que aún requiere investigación.", "Las frases reales pueden combinar varias capas. “Solo abrieron dos horas, así que el servicio es insuficiente” contiene una afirmación de duración y una valoración. Conviene separarlas: comprobar la primera y discutir el criterio de la segunda. El criterio puede ser el tiempo necesario para atender a la comunidad.", "No uses “es solo tu opinión” para evitar una discusión importante. Una opinión puede estar cuidadosamente argumentada o ser muy débil. Tampoco llames hecho a todo lo que coincide con tu postura. La distinción sirve para elegir cómo examinar una afirmación, no para despreciar a quien la presenta."]}, {"title": "3.3 · La arquitectura de un argumento", "paragraphs": ["Un argumento ofrece una o más premisas como apoyo de una conclusión. Las premisas son las razones; la conclusión es lo que se intenta sostener. Por ejemplo: “Los libros prestados deben devolverse para que otras personas los usen. Tengo un libro cuyo plazo terminó. Por eso debo devolverlo”. Podemos discutir las razones y si apoyan la conclusión.", "Palabras como porque, dado que o ya que suelen introducir razones. Por tanto, así que o en consecuencia pueden anunciar una conclusión. Son pistas, no reglas infalibles. La conclusión puede aparecer al comienzo y algunas premisas pueden quedar implícitas. Comprender un argumento requiere interpretar su función, no solo buscar una palabra.", "Una lista de frases no siempre forma un argumento. “La biblioteca es grande y tiene ventanas” describe. “Conviene aprovechar la luz de esas ventanas para leer porque mejora la visibilidad” intenta justificar una acción. Una explicación responde por qué ocurrió algo; un argumento intenta justificar por qué aceptar una afirmación, aunque en el lenguaje cotidiano puedan relacionarse.", "Para reconstruir un argumento, escribe primero la conclusión en una oración. Luego pregunta qué razones se ofrecen. Si necesitas una premisa implícita, indícala como una reconstrucción, no como una frase pronunciada por la otra persona. Finalmente pregunta si cada razón es relevante y si necesita evidencia adicional."]}, {"title": "3.4 · Verdad, validez y probabilidad", "paragraphs": ["La verdad es una propiedad de afirmaciones; la validez deductiva es una relación entre premisas y conclusión. Un argumento deductivamente válido no permite que sus premisas sean todas verdaderas y su conclusión falsa al mismo tiempo. La validez no asegura por sí sola que las premisas sean verdaderas.", "Observa esta forma: todos los animales de la categoría A tienen la propiedad B; este animal pertenece a A; por tanto tiene B. Si las premisas se cumplen, la conclusión se sigue. En cambio, afirmar que algo tiene B no basta para demostrar que pertenece a A, porque otras cosas también podrían tener esa propiedad. Este error aparece cuando alguien confunde un indicio con una prueba suficiente.", "Un razonamiento inductivo busca apoyo probable: si observamos que la fila del comedor fue larga durante varios días, podemos esperar que vuelva a serlo. La conclusión puede ser razonable sin estar garantizada. Importan el número de observaciones, su diversidad y las condiciones de la muestra. Observar solo un día especial no describe necesariamente todo el mes.", "Usamos ambos tipos de razonamiento en la vida cotidiana. El error no consiste en trabajar con probabilidades, sino en presentarlas como certezas absolutas. Antes de aceptar una conclusión, pregunta si debería seguirse necesariamente o si se propone como la explicación o predicción más plausible."]}, {"title": "3.5 · Errores que parecen razones", "paragraphs": ["Una falacia es un defecto en un razonamiento que puede parecer convincente. Atacar a la persona en lugar de examinar su argumento es un ejemplo: decir que una propuesta es mala porque quien la hizo es antipático no evalúa la propuesta. Esto no significa que la confiabilidad de una fuente nunca importe; importa cuando es pertinente para valorar su testimonio.", "Apelar únicamente a la popularidad también puede fallar: una publicación no se vuelve verdadera por recibir miles de reacciones. Una generalización apresurada extrae una conclusión muy amplia de pocos casos: “dos personas llegaron tarde, así que ese grupo nunca es responsable”. Un falso dilema presenta solo dos opciones cuando existen alternativas relevantes.", "El sesgo de confirmación consiste en favorecer información que coincide con lo que ya pensamos y descuidar la que lo cuestiona. No se corrige únicamente acusando a otros de estar sesgados. Podemos practicarlo sobre nuestras propias ideas: buscar la mejor objeción, revisar una fuente independiente y señalar qué evidencia nos haría cambiar.", "Aprender nombres de falacias es menos importante que explicar el defecto concreto. En lugar de lanzar una etiqueta, di por qué la razón no sostiene la conclusión. También recuerda que encontrar un argumento defectuoso no demuestra automáticamente que su conclusión sea falsa: quizá exista otro argumento mejor."]}, {"title": "3.6 · Verificar antes de compartir", "paragraphs": ["Imagina una captura que anuncia la cancelación de clases. Antes de reenviarla, busca el mensaje original, identifica quién lo publicó y revisa la fecha. Una captura puede omitir contexto; un anuncio verdadero del año pasado puede ser engañoso si se presenta como actual. Después contrasta con un canal oficial pertinente o una fuente independiente que haya comprobado el mismo hecho.", "La verificación debe ser proporcional a la afirmación. Una noticia sobre horarios requiere una fuente distinta de una afirmación científica. El aspecto profesional de una página no garantiza calidad. Examina si ofrece evidencias, identifica responsables y permite rastrear el origen de sus datos. Dos páginas que copian la misma publicación no constituyen dos comprobaciones independientes.", "El contenido generado con inteligencia artificial también necesita revisión. Puede presentar información útil, errores o referencias inexistentes con un tono muy seguro. No se puede concluir con certeza quién escribió un texto solo por su estilo. Para aprender, interesa contrastar sus afirmaciones, reconocer ayudas utilizadas y explicar el propio proceso.", "Tu producto será una ficha de verificación de un caso ficticio o de una afirmación pública que no exponga a un compañero. Registra la frase exacta, qué tipo de afirmación es, qué fuentes consultaste y qué conclusión permite la evidencia: confirmada, refutada o todavía no determinada. No determinado es una respuesta legítima."]}], "case": {"title": "La captura sin fecha", "text": "Llega al chat una imagen con el escudo del colegio: “Mañana no hay clases”. No aparece fecha ni enlace. Tres amigos la reenviaron, pero ninguno sabe de dónde salió.", "steps": ["Separa lo observado de lo supuesto.", "Explica por qué tres reenvíos no son tres fuentes independientes.", "Propón una ruta para encontrar la publicación original y contrastarla.", "Redacta un mensaje prudente mientras no se conoce la respuesta."], "model": "Una respuesta razonable dice que la captura existe, pero su vigencia no está confirmada. Conviene revisar el canal institucional o consultar a una persona autorizada. Puede informarse al grupo que se está verificando sin presentar la cancelación como un hecho."}, "practice": {"title": "Laboratorio de argumentos y verificación", "steps": ["Elige una afirmación pública de bajo riesgo o usa la captura ficticia del caso.", "Escribe una conclusión y dos premisas que permitirían sostenerla; señala qué información falta.", "Consulta dos fuentes pertinentes y comprueba si son independientes. Si trabajas sin Internet, describe el procedimiento pendiente sin inventar resultados.", "Construye una objeción y revisa si hay generalización, ataque personal o falsa alternativa.", "Redacta tu dictamen y distingue lo comprobado de lo probable."], "prompts": ["Afirmación, conclusión y premisas: ¿qué se sostiene y con qué razones?", "Fuentes, autoría, fechas y evidencia encontrada o pendiente.", "Objeción y posible error de razonamiento.", "Dictamen final y grado de confianza justificado."], "criteria": ["Separo datos, interpretaciones y valoraciones.", "Identifico las premisas y la conclusión.", "No confundo reenvíos con fuentes independientes.", "La conclusión respeta los límites de la evidencia."]}, "quiz": [{"q": "“Todos lo comparten, por eso es verdadero” se apoya solo en…", "opts": ["Una prueba independiente.", "Una deducción válida.", "La popularidad."], "answer": 2, "why": "La circulación de una idea no demuestra su verdad."}, {"q": "En “Debemos reparar la rampa porque facilita el acceso”, la conclusión es…", "opts": ["Debemos reparar la rampa.", "Facilita el acceso.", "Porque."], "answer": 0, "why": "La acción propuesta es lo que se intenta sostener; la accesibilidad es la razón ofrecida."}, {"q": "Un argumento deductivamente válido…", "opts": ["Tiene siempre premisas verdaderas.", "No puede tener todas las premisas verdaderas y la conclusión falsa.", "Es el que recibe más aprobación."], "answer": 1, "why": "La validez describe la relación lógica; todavía hay que revisar la verdad de las premisas."}, {"q": "Una captura sin fecha permite concluir que…", "opts": ["El anuncio sigue vigente.", "El anuncio es necesariamente falso.", "Hace falta comprobar su origen y vigencia."], "answer": 2, "why": "La ausencia de datos suficientes exige verificar, no afirmar ni negar automáticamente."}], "resources": [{"title": "UNAM · Premisas y conclusión", "url": "https://recursoseducativos.unam.mx/handle/123456789/21795", "guide": "Consulta la ficha y su enlace al recurso. Reconstruye un argumento con palabras propias. Si la actividad antigua no carga, utiliza el laboratorio interno de este módulo.", "level": "Ampliación de bachillerato · selección guiada"}, {"title": "UNESCO · Información falsa y verificación", "url": "https://www.unesco.org/mil4teachers/es/module4/unit5", "guide": "Lee el ejercicio de verificación y adapta sus preguntas a una afirmación escolar. No necesitas completar la unidad dirigida a educadores.", "level": "Lectura guiada"}]}, {"id": 4, "title": "Ética para decidir", "subtitle": "Libertad, cuidado y vida buena", "icon": "⚖", "hours": "5 horas sugeridas", "intro": "Las decisiones difíciles no se resuelven contando votos ni siguiendo el primer impulso. Aprende a reconocer valores en tensión, comparar alternativas y justificar una acción responsable.", "objectives": ["Distinguir costumbre, norma y reflexión ética.", "Examinar un dilema desde consecuencias, deberes y cuidado.", "Proponer una decisión que considere a las personas afectadas."], "lessons": [{"title": "4.1 · Moral y ética: vivir y examinar cómo vivimos", "paragraphs": ["En un uso frecuente, llamamos moral al conjunto de valores, normas y prácticas con que una comunidad orienta su vida. La ética es la reflexión crítica sobre esas orientaciones: pregunta cómo justificarlas, qué problemas presentan y qué significa actuar bien. Los términos pueden usarse de otras maneras, pero esta distinción es útil para comenzar.", "Una costumbre describe algo que se hace habitualmente. Que una práctica sea antigua o mayoritaria no demuestra que sea justa. Si un grupo acostumbra ridiculizar a quien se equivoca, debemos examinar sus efectos y sus razones. “Siempre se ha hecho así” explica una continuidad, pero no basta para justificarla.", "También hay diferencias entre legalidad y valoración ética. Una regla escrita puede necesitar revisión, y una acción permitida puede resultar poco cuidadosa. Este módulo no sustituye el conocimiento de las normas escolares: añade preguntas sobre sus propósitos, su coherencia y sus efectos. Criticar razonadamente una norma requiere entenderla antes de atribuirle intenciones.", "La ética no consiste únicamente en detectar errores ajenos. También nos invita a revisar hábitos propios: si escuchamos, si cumplimos acuerdos y cómo respondemos cuando hemos causado un daño. La pregunta central no es solo “¿me van a castigar?”, sino “¿qué razones tengo para actuar así?”."]}, {"title": "4.2 · Libertad y responsabilidad", "paragraphs": ["La libertad no significa que toda acción carezca de límites. Elegimos dentro de condiciones: recursos, información, relaciones y normas. Reconocer esas condiciones ayuda a comprender cuánto control tenía una persona y qué alternativas estaban realmente disponibles. No es razonable exigir la misma responsabilidad en circunstancias muy diferentes.", "Ser responsable incluye anticipar consecuencias previsibles, explicar decisiones y responder por sus efectos. La intención importa, pero no lo explica todo. Una broma hecha para divertir puede lastimar; reconocer el daño no obliga a fingir que se buscó, pero sí a considerar una reparación. “No era mi intención” puede iniciar una explicación, no cerrar la conversación.", "La presión del grupo puede reducir nuestra facilidad para elegir. Practicar frases como “prefiero no compartirlo” o “necesito pensarlo” ofrece un margen de autonomía. Pedir apoyo no elimina la libertad: a veces la fortalece porque permite actuar sin quedar aislado frente a una presión injusta.", "La autonomía consiste en examinar razones y orientarse por criterios que podemos defender, no simplemente en hacer lo contrario de los demás. Obedecer una regla razonable puede ser una decisión autónoma; desobedecer por imitación también puede ser una forma de dependencia. Lo importante es examinar la relación entre decisión, razones y contexto."]}, {"title": "4.3 · Tres lentes para un dilema", "paragraphs": ["Un dilema enfrenta valores o responsabilidades que parecen entrar en tensión. No toda decisión difícil es un dilema moral: elegir un sabor puede ser complicado sin involucrar un conflicto ético. Para reconocer un dilema, nombra qué bienes podrían afectarse y quiénes dependen de la decisión.", "Una mirada centrada en consecuencias pregunta qué efectos previsibles tendría cada alternativa, para quién y durante cuánto tiempo. No basta sumar beneficios generales ignorando daños graves a una minoría. Una mirada centrada en deberes y respeto pregunta qué compromisos y límites no deberían tratarse como simples obstáculos.", "Una tercera mirada puede atender a las virtudes y al cuidado: qué hábitos estamos cultivando, cómo actúa una persona justa o prudente y qué relaciones de dependencia debemos considerar. Estas preguntas no son una calculadora automática. Ayudan a reconocer aspectos que la primera impresión puede ocultar.", "Supón que un amigo pide copiar tu trabajo. Puedes querer ayudarlo y, al mismo tiempo, valorar la honestidad y el aprendizaje. Comparar consecuencias, compromisos y cuidado permite imaginar una alternativa: acompañarlo a comprender el ejercicio sin entregar tu trabajo como si fuera suyo. Buscar alternativas evita aceptar el dilema exactamente como fue presentado."]}, {"title": "4.4 · Justicia, igualdad y equidad", "paragraphs": ["La igualdad reconoce que las personas merecen igual consideración. Eso no implica que toda distribución idéntica sea adecuada. Si una actividad exige leer un texto y una persona necesita una versión accesible, ofrecer el mismo archivo sin adaptación puede mantener una barrera. La equidad examina las condiciones necesarias para que la participación sea efectiva.", "Tampoco significa que cualquier diferencia de trato sea justa. Debe existir una razón pertinente, explicable y revisable. Dar más tiempo por una necesidad de accesibilidad es distinto de favorecer sin motivo a quien nos cae mejor. Pregunta qué objetivo se busca, qué barrera se intenta remover y cómo se escuchó a la persona afectada.", "La justicia distributiva examina cómo repartir oportunidades, cargas o recursos. La justicia en los procedimientos pregunta cómo se toman decisiones: quién participa, qué información se utiliza y cómo se puede reclamar. Un resultado aceptable no vuelve irrelevante un procedimiento que humilla o excluye.", "En un trabajo grupal podemos combinar reglas comunes con apoyos diferentes. Todos contribuyen, pero las tareas pueden organizarse según posibilidades y acuerdos, sin convertir diferencias en etiquetas permanentes. Una distribución responsable se revisa cuando cambian las condiciones y evita asumir necesidades sin preguntar."]}, {"title": "4.5 · Empatía, cuidado y reparación", "paragraphs": ["La empatía permite intentar comprender una experiencia distinta, pero no nos vuelve capaces de leer la mente. En lugar de asegurar “sé exactamente cómo te sientes”, podemos preguntar y escuchar. También hay que distinguir comprender una emoción de justificar cualquier acción que surge de ella.", "El cuidado atiende a necesidades concretas. No consiste en decidir siempre por otra persona ni en imponer ayuda no solicitada. Requiere reconocer capacidades, preguntar qué apoyo es útil y evitar exponer a alguien en nombre de ayudar. La buena intención necesita información y respeto.", "Cuando hemos causado daño, reparar puede incluir reconocer lo ocurrido, detener la conducta, corregir información y acordar una acción proporcionada. Una disculpa pierde sentido si exige que la otra persona olvide de inmediato. El perdón no se puede imponer como una tarea escolar ni convertir en condición para respetar a quien fue afectado.", "En situaciones de acoso o riesgo no corresponde exigir a un estudiante que resuelva solo el conflicto. Buscar apoyo de una persona adulta de confianza es una acción responsable. En las prácticas usaremos casos ficticios: no es necesario contar experiencias íntimas para aprender a deliberar éticamente."]}, {"title": "4.6 · Un procedimiento de deliberación", "paragraphs": ["Comienza describiendo los hechos que conoces y separándolos de las suposiciones. Identifica a las personas afectadas, incluidas las que no participan en la conversación. Después nombra los valores en tensión: honestidad, lealtad, privacidad, aprendizaje, seguridad o justicia. Evita reducir el caso a “bueno contra malo” antes de examinarlo.", "Propón al menos tres alternativas. La tercera suele abrir la discusión: quizá no sea necesario elegir entre abandonar a alguien y aceptar todo lo que pide. Evalúa cada alternativa con las tres lentes del módulo. Señala consecuencias inciertas y límites que no deberían vulnerarse.", "Elige una acción y explica por qué resulta preferible en ese contexto. Después formula una objeción seria a tu propia decisión. Si no puedes imaginar ninguna, revisa si consideraste las otras perspectivas. Finalmente indica cómo evaluarás el resultado y qué harías si la situación cambia.", "En las preguntas abiertas del módulo no hay un algoritmo que otorgue una calificación moral. Se revisará si distingues hechos, consideras alternativas, respetas a las personas y conectas tu decisión con razones. Dos respuestas distintas pueden estar bien argumentadas, aunque no todas las razones tengan la misma fuerza."]}], "case": {"title": "La foto del grupo", "text": "Una foto graciosa del paseo recibe muchos comentarios. Una compañera pide retirarla porque se siente expuesta. Quien la publicó dice que borrarla arruinaría la diversión del grupo.", "steps": ["Identifica la petición y los intereses involucrados sin juzgar la emoción de la compañera.", "Compara mantener, retirar o sustituir la foto por otra acordada.", "Analiza consecuencias, respeto y cuidado.", "Propón una reparación y una regla futura para compartir imágenes."], "model": "Retirar la imagen y acordar previamente futuras publicaciones atiende la petición y permite otras formas de compartir el paseo. La cantidad de reacciones no vuelve irrelevante a la persona expuesta. La justificación debe explicar por qué el cuidado y el consentimiento pesan en el caso."}, "practice": {"title": "Consejo ético del salón", "steps": ["Trabaja con el caso de la foto o crea otro caso ficticio de baja complejidad.", "Asigna papeles: persona afectada, quien decide, observador y moderador. Si trabajas solo, escribe desde tres perspectivas.", "Elabora tres alternativas y examina consecuencias, compromisos y cuidado.", "Redacta una recomendación que incluya una objeción y una respuesta.", "Diseña una forma de comprobar si la medida ayudó y qué revisarías después."], "prompts": ["Hechos, suposiciones y personas afectadas.", "Valores en tensión y tres alternativas.", "Mi decisión con razones, objeción y respuesta.", "Propuesta de reparación o seguimiento."], "criteria": ["No confundo intención con todos los efectos de la acción.", "Considero a quienes tienen menos voz.", "Comparo alternativas con criterios explícitos.", "Propongo seguimiento y una revisión posible."]}, "quiz": [{"q": "“Siempre lo hemos hecho así” demuestra que una práctica es…", "opts": ["Justa necesariamente.", "Habitual, pero aún necesita evaluación.", "Obligatoria para cualquier persona."], "answer": 1, "why": "La costumbre no demuestra por sí sola la justicia de una práctica."}, {"q": "La equidad busca…", "opts": ["Favorecer siempre a los amigos.", "Dar exactamente lo mismo sin atender barreras.", "Considerar condiciones relevantes para una participación efectiva."], "answer": 2, "why": "Los apoyos diferentes requieren razones pertinentes y no favoritismos."}, {"q": "Si no quise causar daño pero lo causé, conviene…", "opts": ["Reconocer los efectos y considerar una reparación.", "Ignorarlo porque la intención basta.", "Exigir que la otra persona olvide."], "answer": 0, "why": "La intención importa, pero también hay responsabilidad ante los efectos."}, {"q": "¿Qué mejora una deliberación ética?", "opts": ["Eliminar toda objeción.", "Comparar alternativas y considerar a las personas afectadas.", "Elegir lo más popular."], "answer": 1, "why": "La deliberación necesita razones, perspectivas y atención a consecuencias."}], "resources": [{"title": "UNICEF · Derechos de niños, niñas y adolescentes", "url": "https://www.unicef.org/es/convencion-derechos-nino/convencion-version-ninos", "guide": "Lee los apartados sobre opinión y privacidad. Aplícalos al caso de la foto en un párrafo, sin copiar el texto.", "level": "Lectura accesible"}, {"title": "UNICEF · Ciberacoso: qué es y cómo detenerlo", "url": "https://www.unicef.org/es/end-violence/ciberacoso-que-es-y-como-detenerlo", "guide": "Consulta las preguntas sobre apoyo y respuesta ante el acoso. Distingue ayudar de exponer a la persona afectada.", "level": "Lectura accesible"}]}, {"id": 5, "title": "Identidad e ideologías", "subtitle": "Pensar por cuenta propia sin dejar de convivir", "icon": "◐", "hours": "5 horas sugeridas", "intro": "¿Quién eres más allá de una etiqueta? Explora cómo se construyen las identidades, cómo influyen los grupos y cómo examinar una ideología sin convertir el desacuerdo en desprecio.", "objectives": ["Distinguir identidad personal, pertenencias y estereotipos.", "Comparar filosofía e ideología sin tratarlas como opuestos absolutos.", "Analizar mensajes y practicar un desacuerdo respetuoso."], "lessons": [{"title": "5.1 · La identidad no cabe en una sola etiqueta", "paragraphs": ["Podemos describirnos mediante recuerdos, relaciones, gustos, valores, capacidades y proyectos. Ningún elemento aislado agota quiénes somos. Ser estudiante, vivir en un barrio o disfrutar cierta música dice algo importante, pero no permite deducir automáticamente nuestras opiniones o decisiones.", "La identidad tiene continuidad y cambio. Puedes recordar una amistad antigua y, al mismo tiempo, reconocer que hoy piensas de otro modo. Cambiar de intereses no implica necesariamente dejar de ser tú. La pregunta filosófica consiste en examinar qué elementos consideramos centrales y por qué. No existe una única respuesta sencilla que sirva para todos los problemas de identidad.", "También somos reconocidos por otras personas. Ese reconocimiento puede apoyar o limitar: una etiqueta como “el que siempre falla” puede ocultar capacidades y oportunidades. Por eso debemos distinguir una descripción de un episodio de una definición total de alguien. Cometer un error no autoriza a reducir la persona al error.", "En este módulo no necesitas revelar información privada. Puedes construir un personaje ficticio para explorar identidad. Lo importante es distinguir lo que la persona elige, lo que recibe de su entorno, lo que otros le atribuyen y lo que desea transformar. Esa distinción ayuda a pensar la autonomía sin imaginar que nacemos fuera de toda relación."]}, {"title": "5.2 · Pertenecer y conservar una voz propia", "paragraphs": ["Los grupos ofrecen lenguaje, compañía, referentes y posibilidades de acción. Pertenecer puede ser una fuente de bienestar. El problema no es tener vínculos, sino que esos vínculos impidan preguntar, obliguen a humillar a otros o condicionen el reconocimiento a una obediencia absoluta.", "La presión puede ser explícita: “si no lo compartes, no eres de los nuestros”. También puede ser sutil: reír para evitar quedar fuera o callar una duda porque todos parecen seguros. Identificar la presión no significa acusar a cada grupo de manipular. Significa reconocer cuándo una decisión se toma por razones y cuándo por temor a perder aceptación.", "Conservar una voz propia requiere práctica. Podemos pedir tiempo, preguntar por el propósito de una acción o proponer una alternativa. A veces basta decir: “quiero seguir en el grupo, pero no estoy de acuerdo con esto”. En situaciones que involucren daño, el apoyo de una persona adulta de confianza puede ser necesario.", "La autonomía no consiste en estar siempre solo ni en rechazar toda influencia. Todos aprendemos de otros. Consiste en poder examinar las influencias, comprender sus efectos y participar en los acuerdos con una voz que no sea anulada. El desacuerdo puede mejorar un grupo cuando se tramita con cuidado."]}, {"title": "5.3 · Filosofía e ideología: diferencias y relaciones", "paragraphs": ["Una ideología puede entenderse como un conjunto articulado de ideas, valores y representaciones que orienta la interpretación de la sociedad y la acción de un grupo. El término tiene usos diferentes: en algunos contextos es descriptivo; en otros se utiliza críticamente para examinar cómo ciertas ideas ocultan o legitiman relaciones de poder.", "No toda ideología es una mentira deliberada ni toda creencia colectiva constituye una ideología completa. Una preferencia musical aislada no equivale a un sistema de ideas sobre la vida social. Para analizar un conjunto de creencias, pregunta qué imagen del mundo ofrece, qué valores prioriza, qué acciones propone y qué deja fuera.", "La filosofía puede examinar los supuestos y argumentos de una ideología. Sin embargo, no existe una separación automática entre filósofos completamente neutrales y grupos totalmente cerrados. Quienes reflexionan también viven en contextos y pueden tener intereses o puntos ciegos. La actitud crítica incluye examinar la propia posición.", "Una comparación útil pregunta si una idea admite objeciones, qué evidencias acepta y qué sucede con quienes discrepan. Una postura puede ser firme y revisable a la vez. El problema aparece cuando cualquier crítica se considera una traición o cuando ninguna evidencia imaginable permitiría reconsiderar una afirmación."]}, {"title": "5.4 · Estereotipos, prejuicios y discriminación", "paragraphs": ["Un estereotipo atribuye rasgos generales a las personas por su pertenencia a un grupo. Un prejuicio es un juicio previo que puede sostenerse sin conocer suficientemente el caso. La discriminación se expresa en un trato injusto o una exclusión relacionados con características o pertenencias. Son conceptos vinculados, pero no idénticos.", "Decir que todas las personas de un lugar son iguales borra diferencias internas. Incluso un estereotipo presentado como elogio puede imponer expectativas rígidas: supone que una persona debe tener cierta capacidad por pertenecer a un grupo. La pregunta adecuada es qué sabemos de esa persona y qué parte estamos suponiendo.", "Una crítica a una idea no equivale por sí misma a discriminar a quien la sostiene. Pero puede convertirse en un ataque a la dignidad cuando deshumaniza o niega participación a un grupo. Podemos discutir una propuesta política o una interpretación religiosa sin presentar a todas sus personas como inferiores.", "Para revisar un estereotipo, busca su forma general, examina la evidencia y construye contraejemplos. Después observa efectos prácticos: a quién se escucha, qué oportunidades se cierran y qué expectativas se imponen. No basta cambiar una palabra si la misma exclusión continúa en la conducta."]}, {"title": "5.5 · Redes sociales, atención e imagen de uno mismo", "paragraphs": ["En una red social mostramos una selección de experiencias. Esa selección puede ser creativa y valiosa, pero no representa la totalidad de una vida. Comparar nuestro día completo con los momentos elegidos de otra persona puede producir una imagen distorsionada. La filosofía pregunta qué entendemos por éxito, reconocimiento y autenticidad.", "Las métricas visibles, como reacciones o seguidores, miden ciertas interacciones; no miden el valor de una persona ni prueban la verdad de un mensaje. Un contenido puede circular porque entretiene, indigna o confirma una idea previa. Preguntar por esos mecanismos ayuda a recuperar atención antes de reaccionar.", "La publicidad puede unir un objeto a una promesa de pertenencia: “si tienes esto, serás alguien”. No toda publicidad es engañosa, pero conviene separar la característica comprobable del producto de la aspiración que intenta activar. Comprar un objeto no garantiza amistad, identidad ni bienestar.", "Una práctica crítica consiste en detenerse ante un mensaje, nombrar la emoción que despierta y examinar qué acción solicita. Luego pregunta qué razones ofrece y qué alternativa no muestra. No necesitas dejar toda tecnología para pensar con autonomía; puedes cambiar la manera de usarla y las preguntas con que la miras."]}, {"title": "5.6 · Disentir con respeto y con precisión", "paragraphs": ["Respetar a alguien no exige aceptar todas sus ideas. También es posible rechazar una afirmación sin burlarse de la persona. Un desacuerdo preciso identifica una proposición y ofrece una razón: “no comparto esa conclusión porque el ejemplo no representa a todo el grupo”. Esto ayuda más que “tú siempre piensas mal”.", "Antes de responder, reconstruye la postura ajena de una manera que la otra persona pueda reconocer. Después distingue qué compartes y qué cuestionas. Tal vez ambos valoran la convivencia, pero discrepan sobre cómo organizar una actividad. Reconocer ese punto común reduce la tentación de inventar intenciones hostiles.", "El pluralismo acepta que en una sociedad conviven formas de vida diversas. No implica que cualquier acción sea aceptable ni que no existan criterios para criticar. Podemos defender la diversidad y, a la vez, cuestionar prácticas que dañan o excluyen. La dificultad está en justificar los límites sin convertir nuestra preferencia personal en medida de todo.", "El producto del módulo será un análisis de un mensaje ficticio de pertenencia y una respuesta dialogante. Identifica la promesa, el supuesto, la evidencia y la posible exclusión. Después escribe una alternativa que permita conservar el vínculo sin aceptar una exigencia injustificada."]}], "case": {"title": "El club de los verdaderos lectores", "text": "Un club anuncia: “Solo quienes leen novelas impresas son lectores de verdad”. Sara disfruta audiolibros y pide participar. Algunas personas dicen que permitirlo destruiría la identidad del club.", "steps": ["Aclara qué se entiende por leer y cuál es el propósito del club.", "Identifica la etiqueta y el supuesto que produce exclusión.", "Distingue una preferencia por un formato de una afirmación sobre el valor de las personas.", "Propón un acuerdo que permita conversar sobre obras y discutir formatos sin descalificar."], "model": "El grupo puede preferir analizar textos impresos en alguna actividad sin afirmar que otros formatos hacen inferiores a sus usuarios. Una propuesta razonada aclara objetivos, escucha necesidades y examina si la exclusión es realmente necesaria."}, "practice": {"title": "Desmontar una etiqueta, construir un diálogo", "steps": ["Crea un anuncio ficticio de un club que prometa pertenencia a cambio de una conducta. Evita usar personas o grupos reales.", "Identifica sus valores, la emoción que activa y la acción que solicita.", "Señala qué afirmaciones necesitan evidencia y qué estereotipo podría aparecer.", "Escribe un diálogo de ocho intervenciones en el que alguien objete la exigencia sin humillar.", "Revisa el acuerdo final: ¿admite desacuerdo?, ¿qué cambió?, ¿quién puede participar ahora?"], "prompts": ["Mensaje ficticio y contexto del grupo.", "Promesa, supuesto, evidencia faltante y posible exclusión.", "Diálogo de ocho intervenciones con razones y preguntas.", "Acuerdo revisado y reflexión sobre autonomía."], "criteria": ["No reduzco identidades a etiquetas.", "Distingo ideología de una simple preferencia.", "Examino el mensaje sin descalificar personas.", "El acuerdo conserva espacio para disentir."]}, "quiz": [{"q": "Una ideología es necesariamente…", "opts": ["Una mentira intencional.", "Un conjunto de ideas que nunca puede analizarse.", "Ninguna de las anteriores."], "answer": 2, "why": "El término tiene usos distintos; las ideologías pueden ser examinadas críticamente."}, {"q": "¿Qué distingue respeto de acuerdo?", "opts": ["Podemos respetar a una persona y cuestionar sus razones.", "Respetar exige aceptar todo.", "Disentir siempre es insultar."], "answer": 0, "why": "La crítica puede dirigirse a una afirmación sin negar la dignidad de quien habla."}, {"q": "“Todos los de ese grupo son irresponsables” es…", "opts": ["Una prueba suficiente.", "Una generalización que requiere examen.", "Una descripción completa de cada persona."], "answer": 1, "why": "Atribuye un rasgo a todas las personas sin considerar diferencias ni evidencia suficiente."}, {"q": "Los seguidores de un perfil miden directamente…", "opts": ["El valor humano de su autor.", "La verdad de cada publicación.", "Una forma de alcance, no esas dos cosas."], "answer": 2, "why": "Las métricas no equivalen a dignidad, verdad o calidad argumentativa."}], "resources": [{"title": "UNICEF Colombia · Escuela de Influenciadores", "url": "https://www.unicef.org/colombia/escuela-de-influenciadores-ciberconscientes", "guide": "Explora la presentación y sus recursos públicos. Elige una práctica digital que fortalezca tu autonomía. Los cursos enlazados pueden tener condiciones diferentes.", "level": "Lectura accesible"}, {"title": "UNESCO · Comunicación, información y juventud", "url": "https://www.unesco.org/es/youth/communication-information", "guide": "Lee el apartado sobre competencias mediáticas y escribe dos preguntas que harías antes de compartir un mensaje.", "level": "Lectura accesible"}]}, {"id": 6, "title": "Filosofía en acción", "subtitle": "Convivencia, ciudadanía y proyecto final", "icon": "↗", "hours": "7 horas sugeridas", "intro": "Convierte lo aprendido en una propuesta pequeña y razonada para mejorar tu entorno. El desafío es conectar preguntas, evidencia, diálogo y evaluación sin prometer soluciones que no puedes comprobar.", "objectives": ["Relacionar reflexión y praxis en una situación cercana.", "Diseñar una propuesta participativa con criterios de justicia.", "Evaluar una acción y comunicar lo aprendido con honestidad."], "lessons": [{"title": "6.1 · Praxis: pensar, actuar y volver a pensar", "paragraphs": ["La palabra praxis se utiliza en diferentes tradiciones filosóficas para pensar la acción humana y su relación con la reflexión. En este curso la trabajamos como una práctica consciente que puede examinar sus propósitos y resultados. No significa simplemente estar ocupado ni realizar una actividad porque estaba en una lista.", "Imagina que el salón está desordenado. Una reacción rápida podría ser colocar un cartel que diga “sean responsables”. Una práctica reflexiva pregunta qué ocurre, cuándo aparece el problema, qué obstáculos existen y cómo se reparten las tareas. Quizá falta un lugar para guardar materiales o nadie conoce el acuerdo de cierre de clase.", "Pensar sin escuchar puede producir soluciones poco útiles. Actuar sin examinar puede repetir errores. La relación entre pensamiento y acción es un ciclo: formular una pregunta, obtener información, deliberar, realizar una acción proporcionada y revisar sus efectos. La revisión puede mostrar que la pregunta inicial estaba mal formulada.", "No necesitas resolver todos los problemas del colegio. Una intervención pequeña y bien justificada permite aprender más que una campaña enorme sin seguimiento. La honestidad incluye reconocer qué pudiste hacer, qué quedó pendiente y qué resultado no puedes atribuir con seguridad a tu propuesta."]}, {"title": "6.2 · Vivir juntos: acuerdos y participación", "paragraphs": ["Una comunidad comparte espacios, recursos y decisiones. La convivencia no exige ausencia total de conflicto; necesita formas de tramitarlo sin anular a las personas. Una regla puede ayudar si su propósito es comprensible, si se aplica con criterios claros y si existen oportunidades para discutir sus dificultades.", "Participar no es solo votar al final. También implica proponer asuntos, recibir información, formular alternativas y conocer qué ocurrió con los aportes. Una consulta pierde sentido si la decisión ya estaba cerrada y nadie explica por qué las opiniones no se tuvieron en cuenta.", "La mayoría puede decidir entre opciones admisibles, pero el número de votos no vuelve justa cualquier medida. Hay que considerar a quienes quedarían en desventaja y los límites relacionados con la dignidad y los derechos. Pregunta quién no pudo asistir, qué voces quedaron fuera y si la forma de participación era accesible.", "En un proyecto escolar, escuchar no significa prometer que toda propuesta será aplicada. Significa registrarla con fidelidad, examinarla y explicar la decisión. Un acta breve puede indicar qué opciones se estudiaron, con qué criterios y qué preguntas permanecen abiertas. Esa transparencia favorece la confianza."]}, {"title": "6.3 · Derechos, responsabilidades y bien común", "paragraphs": ["Los derechos ofrecen un lenguaje para reconocer exigencias básicas de respeto y participación. En la guía de UNICEF sobre derechos de la infancia puedes consultar, entre otros, los apartados sobre opinión, información y privacidad. En el curso los usamos como puntos de referencia para examinar prácticas escolares, no como asesoría jurídica sobre casos particulares.", "Las responsabilidades permiten cuidar las condiciones de convivencia. Tener derecho a expresarse no elimina la necesidad de escuchar o de evitar exponer información privada de otras personas. Al mismo tiempo, los derechos no son un premio que se retira automáticamente a quien comete un error. La respuesta a un conflicto debe conservar el respeto por las personas.", "El bien común no es simplemente lo que beneficia al grupo más numeroso ni la suma de preferencias individuales. Pregunta por condiciones compartidas que permitan a todos desarrollar su vida: espacios accesibles, información comprensible o un ambiente de confianza. Es necesario discutir cómo distribuir cargas y beneficios.", "Para analizar un acuerdo, aplica tres preguntas: ¿qué necesidad atiende?, ¿quién podría quedar excluido?, ¿cómo se puede revisar? Una buena propuesta no oculta sus costos. Si exige tiempo o recursos, explica quién los aporta y busca que la carga no recaiga siempre sobre las mismas personas."]}, {"title": "6.4 · Escuchar y reunir evidencia sin invadir", "paragraphs": ["Investigar un problema escolar no requiere recolectar información íntima. Podemos observar un espacio, revisar un acuerdo público o conversar voluntariamente sobre una necesidad general. No registres nombres, fotografías o situaciones sensibles si no son necesarios. Para cualquier actividad real fuera del trabajo habitual, acuerda el alcance con tu docente.", "Distingue observación, testimonio e interpretación. “Durante dos recreos había materiales fuera de su lugar” describe una observación limitada. “Una persona dijo que no encuentra dónde guardarlos” registra una perspectiva. “Nadie se interesa por el salón” es una interpretación amplia que esos datos no demuestran.", "Una pregunta de conversación debe ser clara y no sugerir la respuesta. “¿Qué dificulta ordenar los materiales?” abre posibilidades; “¿no crees que todo se debe a la pereza?” dirige la conversación y atribuye una causa. También puedes preguntar qué intentos anteriores funcionaron o no y por qué.", "Cuando presentes la información, explica sus límites. Tres conversaciones no representan automáticamente a toda la institución. Si una persona no desea participar, respeta su decisión. Si no puedes realizar trabajo de campo, usa un caso simulado y señala claramente que tus datos son hipotéticos. Nunca presentes una simulación como evidencia recogida."]}, {"title": "6.5 · Diseñar una acción pequeña y evaluable", "paragraphs": ["Una propuesta clara conecta problema, objetivo, acción e indicador. El problema describe una situación; el objetivo expresa el cambio deseado; la acción indica qué se hará; el indicador permite observar si hubo avance. Si confundes estos elementos, puedes terminar contando actividades sin saber si ayudaron.", "Ejemplo ficticio: el problema es que parte del grupo no comprende las instrucciones de préstamo de materiales. El objetivo es hacerlas comprensibles. La acción es redactar y probar una guía breve con compañeros voluntarios. Un indicador podría ser cuántas personas logran explicar el procedimiento después de leerla. Repartir veinte guías es una actividad realizada, no una prueba suficiente de comprensión.", "Define un plazo realista, responsabilidades y recursos. Anticipa un riesgo: una instrucción demasiado larga puede seguir confundiendo. Propón una adaptación y una forma de escuchar comentarios. No necesitas garantizar que funcionará; necesitas explicar por qué vale la pena probarla y cómo sabrás si requiere cambios.", "Compara una situación inicial y una posterior solo si puedes observarlas con criterios similares. Si ocurrieron otros cambios al mismo tiempo, evita atribuir todo el resultado a tu acción. Aprender de un intento que no funcionó también es valioso cuando describes el proceso con honestidad."]}, {"title": "6.6 · Comunicar, evaluar y continuar", "paragraphs": ["El proyecto final reúne lo aprendido en los módulos anteriores. Del primero toma una pregunta clara; del segundo, la capacidad de mirar una situación desde otra perspectiva; del tercero, el examen de evidencias y argumentos; del cuarto, los criterios éticos; del quinto, la atención a pertenencias y exclusiones.", "La entrega puede ser un informe breve, una presentación oral con apoyo escrito o un pequeño mural acompañado de una explicación. En todos los formatos debe poder reconocerse el mismo razonamiento: qué problema examinaste, qué información usaste, qué alternativas comparaste y por qué elegiste una acción.", "No presentes una propuesta como si ya hubiera sido ejecutada. Puedes entregar un diseño completo si no existe autorización o tiempo para aplicarlo, e indicar qué se comprobaría después. Si sí realizaste la acción, distingue resultados observados, opiniones de participantes e interpretaciones tuyas. Incluye al menos una limitación.", "Cierra con una revisión personal. ¿Qué idea cambió durante el curso? ¿Qué objeción te ayudó más? ¿Qué pregunta queda abierta? La filosofía para la vida no termina cuando aparece una respuesta: continúa en la disposición a preguntar mejor, actuar con razones y aprender de las consecuencias."]}], "case": {"title": "Una biblioteca para todos", "text": "Un grupo propone que solo quienes tienen mejores notas puedan usar los libros nuevos. Asegura que así se cuidarán más. Otros estudiantes piden acceso y sugieren acuerdos de préstamo.", "steps": ["Identifica qué afirmación sobre el cuidado necesita evidencia.", "Examina si la nota es un criterio pertinente para permitir acceso.", "Propón dos alternativas que atiendan el cuidado sin excluir de entrada.", "Diseña una prueba pequeña y un indicador de funcionamiento."], "model": "Se puede acordar un préstamo con instrucciones claras, registro mínimo y responsabilidades compartidas. La afirmación de que solo ciertas notas garantizan cuidado necesita respaldo. La prueba podría observar devoluciones y dificultades, sin convertir el acceso en un premio arbitrario."}, "practice": {"title": "Proyecto final · Una pregunta que transforma", "steps": ["Elige un problema pequeño de convivencia, acceso a información o uso compartido de materiales. Formula una pregunta y delimita el contexto.", "Describe la situación con observaciones o con un escenario explícitamente simulado. Incluye perspectivas distintas sin datos personales.", "Compara tres alternativas con argumentos, consecuencias y criterios de inclusión.", "Diseña un objetivo, una acción, responsables, recursos, plazo e indicador. Solicita acuerdo docente antes de cualquier ejecución real.", "Si aplicas la acción, registra resultados y límites. Si no, entrega un diseño y explica qué evidencia faltaría.", "Prepara una conclusión con una objeción a tu propuesta, una respuesta y una pregunta para continuar."], "prompts": ["Problema delimitado, pregunta y situación inicial.", "Evidencia o simulación declarada, fuentes y perspectivas.", "Tres alternativas: razones, riesgos y criterios de elección.", "Plan: objetivo, acción, responsables, recursos, plazo e indicador.", "Resultados observados o evaluación prevista; límites y ajustes.", "Conclusión: qué cambió en mi manera de pensar y qué sigue abierto."], "criteria": ["La pregunta y el problema son concretos y coherentes.", "La evidencia es honesta y se diferencia de una simulación.", "La elección considera objeciones, derechos y perspectivas.", "La acción es viable y tiene un indicador pertinente.", "La evaluación reconoce límites y propone ajustes."]}, "quiz": [{"q": "La praxis, como se trabaja en este curso, relaciona…", "opts": ["Acción y reflexión revisable.", "Actividad sin propósito.", "Opinión sin consecuencias."], "answer": 0, "why": "La práctica consciente examina propósitos, acciones y resultados."}, {"q": "¿Cuál es un indicador más cercano a la comprensión de una guía?", "opts": ["Cuántas copias se imprimieron.", "Cuántas personas explican el procedimiento tras leerla.", "Cuántos colores tiene."], "answer": 1, "why": "Imprimir mide una actividad; explicar el procedimiento aporta evidencia de comprensión."}, {"q": "Si no ejecutaste el proyecto, debes…", "opts": ["Inventar resultados plausibles.", "Ocultar esa parte.", "Presentarlo como diseño e indicar la evaluación pendiente."], "answer": 2, "why": "La honestidad permite distinguir propuesta y ejecución."}, {"q": "Una decisión tomada por mayoría…", "opts": ["Siempre es justa.", "Todavía debe examinar sus efectos y posibles exclusiones.", "No necesita razones."], "answer": 1, "why": "El procedimiento de votación no reemplaza la evaluación de justicia."}], "resources": [{"title": "UNICEF · Participación y derechos", "url": "https://www.unicef.org/es/convencion-derechos-nino/convencion-version-ninos", "guide": "Consulta el apartado sobre opinión. Diseña una forma de escuchar a quienes no suelen intervenir y explica cómo considerarás sus aportes.", "level": "Lectura accesible"}, {"title": "UNICEF Colombia · Guía pedagógica sobre Internet", "url": "https://www.unicef.org/colombia/informes/guia-pedagogica-para-la-mediacion-docente-en-el-uso-de-internet", "guide": "Abre la página y su documento descargable. Con apoyo docente, selecciona una actividad vinculada a tu proyecto; no es necesario leer toda la guía.", "level": "Documento PDF · ampliación acompañada"}]}];
